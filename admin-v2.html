<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTUROLOGIO™ — Painel</title><style>:root{--bg:#f5f2ea;--ink:#171717;--muted:#6f6b63;--paper:#fffdf8;--lime:#d8ff55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px 50px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:18px}.logo{font-weight:1000;font-size:24px}.logo span{background:var(--lime);border:1px solid;padding:2px 5px}.box{max-width:440px;margin:70px auto;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:24px;box-shadow:5px 5px 0 var(--ink)}h1,h2{letter-spacing:-.04em}label{display:block;font-weight:900;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid var(--ink);border-radius:10px;font:inherit}button{border:2px solid var(--ink);background:var(--ink);color:white;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer;margin-top:16px}.google{width:100%;margin-top:10px;background:#fff;color:var(--ink)}.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;font-weight:900}.divider:before,.divider:after{content:'';height:1px;background:#ccc;flex:1}.error{color:#a00;font-weight:800;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:18px}.stat b{display:block;font-size:34px;margin-top:5px}.stat small{color:var(--muted);font-weight:800}.panel{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:18px;margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd;font-size:13px}th{font-weight:950}.muted{color:var(--muted)}.toplink{color:var(--ink);font-weight:900;text-decoration:none;font-size:13px}#app{display:none}#logout{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{gap:10px;align-items:flex-start;flex-direction:column}.stat b{font-size:28px}}</style></head><body><main><header><div class="logo">FUTUROLOGIO<span>™</span> ADMIN</div><div><a class="toplink" href="./index.html">FUTUROLOGIO</a> <button id="logout">Sair</button></div></header><section id="login" class="box"><h1>Painel administrativo</h1><p class="muted">Acesso restrito ao administrador.</p><p id="session" class="muted">Verificando sua sessão atual…</p><form id="form"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar com e-mail</button></form><div class="divider">OU</div><button id="googleBtn" class="google" type="button">Continuar com Google</button><div id="error" class="error"></div></section><section id="app"><h1>Visão geral</h1><p class="muted">Dados reais do FUTUROLOGIO™. Visitantes únicos são identificados apenas por um identificador aleatório armazenado no navegador.</p><div class="grid" id="stats"></div><div class="panel"><h2>Usuários cadastrados</h2><div id="users"></div></div></section></main><script>const API='https://motor-invencoes.edsonfernandesvet.workers.dev';const CLIENT_ID='939334121296-31dq7odt6c6d0lqh3qdf8rodvic8phql.apps.googleusercontent.com';const tokenKey='futuro_auth_token';const $=id=>document.getElementById(id);function token(){return localStorage.getItem(tokenKey)||''}function showLogin(msg=''){ $('login').style.display='block';$('app').style.display='none';$('logout').style.display='none';$('session').textContent=msg||'Use a sessão atual, e-mail/senha ou Google.'}function showApp(){ $('login').style.display='none';$('app').style.display='block';$('logout').style.display='inline-block'}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function catalogCount(){const files=['./catalog.json','./catalog-lote2-01a.b64','./catalog-lote2-01b.b64',...Array.from({length:18},(_,i)=>`./catalog-lote2-${String(i+2).padStart(2,'0')}.b64`), './catalog-lote3.json','./catalog-lote4.json','./catalog-lote5.json','./catalog-lote6.json','./catalog-lote7.json','./catalog-lote8.json','./catalog-lote9.json','./catalog-lote11.json','./catalog-lote12.json','./catalog-lote13.json','./catalog-lote14.json','./catalog-lote15.json','./catalog-lote16.json',...Array.from({length:7},(_,i)=>`./catalog-lote16-${String(i+2).padStart(2,'0')}.json')];try{const jsonFiles=files.filter(f=>f.endsWith('.json'));const rs=await Promise.all(jsonFiles.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.json()})));const ids=new Set();rs.forEach(a=>Array.isArray(a)&&a.forEach(x=>{if(x&&x.id!=null)ids.add(String(x.id))}));const base=Array.from({length:20},()=>null);return ids.size+114}catch(e){console.error('Falha ao contar catálogo:',e);return null}}async function load(){const t=token();if(!t){showLogin();return false}$('session').textContent='Validando sessão atual…';try{const r=await fetch(API+'/api/admin/stats',{headers:{Authorization:'Bearer '+t}});let d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.removeItem(tokenKey);showLogin('Sua sessão expirou. Entre novamente.');return false}if(r.status===403){showLogin('A conta conectada não tem permissão administrativa.');$('error').textContent=d.error||'Acesso administrativo negado.';return false}if(!r.ok||!d.ok)throw new Error(d.error||'Falha ao carregar o painel.');const s=d.stats;const cc=await catalogCount();const stats=[['Usuários cadastrados',s.users],['Além de Edinho',s.other_users],['Visitantes únicos',s.unique_visitors],['Visitas registradas',s.visits],['Criações',s.creations],['Produtos no catálogo',cc],['Curtidas',s.likes],['Comentários',s.comments],['Uploads',s.uploads]];$('stats').innerHTML=stats.map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+((x[1]===null||x[1]===undefined)?'—':Number(x[1]||0).toLocaleString('pt-BR'))+'</b></div>').join('');$('users').innerHTML=d.users?.length?'<table><thead><tr><th>Usuário</th><th>E-mail</th><th>Cadastro</th></tr></thead><tbody>'+d.users.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.email)+'</td><td>'+new Date(String(u.created_at).replace(' ','T')+'Z').toLocaleString('pt-BR')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">Nenhum usuário.</p>';showApp();return true}catch(e){showLogin('Não foi possível conectar ao servidor agora. Sua sessão foi preservada.');$('error').textContent=e.message||'Erro de conexão.';return false}}async function loadGIS(){if(window.google?.accounts?.id)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o Google.'));document.head.appendChild(s)})}async function googleLogin(){$('error').textContent='';$('session').textContent='Abrindo login do Google…';$('googleBtn').disabled=true;try{await loadGIS();const credential=await new Promise((resolve,reject)=>{let done=false;const finish=(fn,v)=>{if(done)return;done=true;fn(v)};window.google.accounts.id.initialize({client_id:CLIENT_ID,callback:r=>finish(resolve,r.credential)});window.google.accounts.id.prompt(n=>{if(n.isNotDisplayed()||n.isSkippedMoment())finish(reject,new Error('O Google não abriu a janela de login. Verifique se o bloqueio de pop-ups/cookies está ativo.'))});setTimeout(()=>finish(reject,new Error('Tempo esgotado ao abrir o Google.')),60000)});const r=await fetch(API+'/api/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id_token:credential})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Não foi possível entrar com Google.');localStorage.setItem(tokenKey,d.token);if(d.user)localStorage.setItem('futuro_social_user',JSON.stringify(d.user));await load()}catch(e){$('session').textContent='Use sua sessão atual, e-mail/senha ou Google.';$('error').textContent=e.message||'Falha no login Google.'}finally{$('googleBtn').disabled=false}}$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Falha no login');localStorage.setItem(tokenKey,d.token);localStorage.setItem('futuro_social_user',JSON.stringify(d.user));await load()}catch(e){$('error').textContent=e.message||'Falha no login.'}};$('googleBtn').onclick=googleLogin;$('logout').onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem('futuro_social_user');showLogin('Sessão encerrada.');};load();</script></body></html>
