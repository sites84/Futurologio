<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>FUTUROLOGIO™ — Administração</title>
<style>
:root{--bg:#f3f1ea;--card:#fffefa;--ink:#171717;--muted:#716e66;--line:#d9d5ca;--accent:#d8ff55;--danger:#a00000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px 16px 50px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding:10px 0 18px;gap:16px}.brand{font-size:24px;font-weight:1000;letter-spacing:-.05em}.brand b{background:var(--accent);border:2px solid var(--ink);padding:0 5px;margin:0 3px}.back{color:var(--ink);font-weight:900;text-decoration:none}
.login{max-width:460px;margin:70px auto 0;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:28px;box-shadow:7px 7px 0 var(--ink)}h1,h2{letter-spacing:-.045em;margin-top:0}.sub{color:var(--muted);line-height:1.45}.field{margin:18px 0 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input{width:100%;padding:14px;border:2px solid var(--ink);border-radius:11px;background:#fff;outline:none}.primary{width:100%;padding:14px 16px;border:2px solid var(--ink);border-radius:11px;background:var(--ink);color:#fff;font-weight:950;cursor:pointer;margin-top:18px}.googlebox{margin-top:16px;display:flex;justify-content:center;min-height:44px}.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:900;margin:20px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.msg{min-height:22px;margin-top:14px;font-size:14px;font-weight:800}.error{color:var(--danger}.ok{color:#176b1c}
#dashboard{display:none}.dashhead{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:32px 0 18px}.dashhead h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer}.dangerbtn{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:17px;min-height:116px}.stat small{display:block;color:var(--muted);font-weight:900;font-size:12px}.stat strong{display:block;font-size:34px;line-height:1.05;margin-top:10px;letter-spacing:-.05em}.stat em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:6px}
.section{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:18px;margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:20px;margin:0}.tablewrap{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}th{font-weight:950}td{color:#333}.pill{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.loading{color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.wrap{padding:12px}.top{align-items:flex-start}.brand{font-size:20px}.login{margin-top:45px;padding:22px}.grid{grid-template-columns:1fr 1fr}.stat{min-height:105px}.stat strong{font-size:27px}.dashhead{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">FUTUROLOGIO<b>™</b> ADMIN</div><a class="back" href="./index.html">Voltar ao site</a></header>
<section id="login" class="login">
<h1>Acesso administrativo</h1><p class="sub">Painel exclusivo do administrador. Entre com a conta administrativa do FUTUROLOGIO™.</p>
<div id="session" class="msg">Verificando sessão...</div>
<form id="emailForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Entrar com e-mail</button></form>
<div class="or">OU</div><div id="googleButton" class="googlebox"></div><div id="error" class="msg error"></div>
</section>
<section id="dashboard">
<div class="dashhead"><div><h1>Painel administrativo</h1><div id="updated" class="sub">Carregando dados...</div></div><div class="actions"><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary dangerbtn">Sair</button></div></div>
<div id="stats" class="grid"></div>
<div class="section"><div class="sectionhead"><h2>Usuários cadastrados</h2><span id="userCount" class="pill">0</span></div><div id="users" class="tablewrap"><span class="loading">Carregando...</span></div></div>
</section>
</div>
<script>
const API='https://motor-invencoes.edsonfernandesvet.workers.dev',GOOGLE_CLIENT_ID='939334121296-31dq7odt6c6d0lqh3qdf8rodvic8phql.apps.googleusercontent.com',TOKEN_KEY='futuro_auth_token',ADMIN_EMAIL='edsonfernandesvet@gmail.com';
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('pt-BR');
function token(){try{return localStorage.getItem(TOKEN_KEY)||''}catch{return ''}}function setMessage(text,kind=''){$('session').textContent=text||'';$('session').className='msg '+kind}function error(text){$('error').textContent=text||''}function showLogin(text=''){ $('login').style.display='block';$('dashboard').style.display='none';setMessage(text||'Entre com sua conta administrativa.') }function showDashboard(){ $('login').style.display='none';$('dashboard').style.display='block' }
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function catalogTotal(){const paths=['catalog.json'];for(let i=3;i<=18;i++)paths.push('catalog-lote'+i+'.json');paths.push('catalog-lote16-02.json','catalog-lote16-03.json','catalog-lote16-04.json','catalog-lote16-05.json','catalog-lote16-06.json','catalog-lote16-07.json');const all=new Set();await Promise.all(paths.map(async p=>{try{const r=await fetch('./'+p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(Array.isArray(d))d.forEach(x=>{if(x?.id!=null)all.add(String(x.id))})}catch{}}));return all.size}
async function loadStats(){const t=token();if(!t){showLogin();return}setMessage('Validando sessão...');error('');try{const r=await fetch(API+'/api/admin/stats?_='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+t}});let d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.removeItem(TOKEN_KEY);showLogin('Sua sessão expirou. Entre novamente.');return}if(r.status===403){showLogin('A conta conectada não tem permissão administrativa.');error(d.error||'Acesso administrativo negado.');return}if(r.status===404)throw new Error('O servidor administrativo ainda não publicou a rota. Tente novamente em alguns segundos.');if(!r.ok||!d.ok)throw new Error(d.error||'Não foi possível carregar os dados.');const s=d.stats||{},total=await catalogTotal(),invented=Number(s.catalog_invented||0),remaining=Math.max(0,total-invented);const cards=[['Usuários cadastrados',s.users,'contas no sistema'],['Outros usuários',s.other_users,'sem contar o administrador'],['Visitantes únicos',s.unique_visitors,'navegadores identificados'],['Visitas',s.visits,'acessos registrados'],['Produtos cadastrados',s.registered_products,'registros de invenções'],['Produtos inventados',invented,'itens do catálogo já usados'],['Ainda no catálogo',remaining,'itens disponíveis'],['Criações dos usuários',s.creations,'criações salvas'],['Curtidas',s.likes,'ações registradas'],['Comentários',s.comments,'comentários registrados'],['Compartilhamentos',s.shares,'ações registradas'],['Uploads',s.uploads,'imagens enviadas'],['Visualizações',s.views,'visualizações de invenções']];$('stats').innerHTML=cards.map(c=>'<article class="stat"><small>'+esc(c[0])+'</small><strong>'+fmt(c[1])+'</strong><em>'+esc(c[2])+'</em></article>').join('');const users=Array.isArray(d.users)?d.users:[];$('userCount').textContent=fmt(s.users);$('users').innerHTML=users.length?'<table><thead><tr><th>Usuário</th><th>E-mail</th><th>Cadastro</th></tr></thead><tbody>'+users.map(u=>'<tr><td><b>'+esc(u.username)+'</b></td><td>'+esc(u.email)+'</td><td>'+formatDate(u.created_at)+'</td></tr>').join('')+'</tbody></table>':'Nenhum usuário cadastrado.';$('updated').textContent='Atualizado em '+new Date().toLocaleString('pt-BR');showDashboard()}catch(e){showLogin('Não foi possível carregar o painel.');error(e.message||'Erro de conexão.')}}
function formatDate(v){if(!v)return '—';const d=new Date(String(v).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?esc(v):d.toLocaleString('pt-BR')}
async function loadGoogle(){if(window.google?.accounts?.id)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o login do Google.'));document.head.appendChild(s)})}
async function googleReady(){await loadGoogle();$('googleButton').innerHTML='';window.google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:async response=>{try{setMessage('Validando conta Google...');error('');const r=await fetch(API+'/api/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id_token:response.credential})});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.error||'Falha na autenticação Google.');if(String(d.user?.email||'').toLowerCase()!==ADMIN_EMAIL)throw new Error('Esta conta Google não é a conta administrativa.');localStorage.setItem(TOKEN_KEY,d.token);if(d.user)localStorage.setItem('futuro_social_user',JSON.stringify(d.user));await loadStats()}catch(e){setMessage('Use a conta administrativa para entrar.');error(e.message||'Falha no login Google.')}}});window.google.accounts.id.renderButton($('googleButton'),{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:360})}
$('emailForm').onsubmit=async e=>{e.preventDefault();error('');setMessage('Validando acesso...');try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.error||'E-mail ou senha incorretos.');if(String(d.user?.email||'').toLowerCase()!==ADMIN_EMAIL)throw new Error('Esta conta não é a conta administrativa.');localStorage.setItem(TOKEN_KEY,d.token);await loadStats()}catch(e){setMessage('Não foi possível entrar.');error(e.message||'Falha no login.')}};
$('refresh').onclick=loadStats;$('logout').onclick=()=>{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem('futuro_social_user');showLogin('Sessão encerrada.')};(async()=>{if(token())await loadStats();else{showLogin();try{await googleReady()}catch(e){error(e.message)}}})();
</script>
</body>
</html>
