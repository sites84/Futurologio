<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTUROLOGIO™ — Painel</title><style>:root{--bg:#f5f2ea;--ink:#171717;--muted:#6f6b63;--paper:#fffdf8;--lime:#d8ff55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px 50px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:18px}.logo{font-weight:1000;font-size:24px}.logo span{background:var(--lime);border:1px solid;padding:2px 5px}.box{max-width:440px;margin:70px auto;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:24px;box-shadow:5px 5px 0 var(--ink)}h1,h2{letter-spacing:-.04em}label{display:block;font-weight:900;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid var(--ink);border-radius:10px;font:inherit}button{border:2px solid var(--ink);background:var(--ink);color:white;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer;margin-top:16px}.error{color:#a00;font-weight:800;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:18px}.stat b{display:block;font-size:34px;margin-top:5px}.stat small{color:var(--muted);font-weight:800}.panel{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:18px;margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd;font-size:13px}th{font-weight:950}.muted{color:var(--muted)}#app{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{gap:10px;align-items:flex-start;flex-direction:column}.stat b{font-size:28px}}</style></head><body><main><header><div class="logo">FUTUROLOGIO<span>™</span> ADMIN</div><button id="logout">Sair</button></header><section id="login" class="box"><h1>Painel administrativo</h1><p class="muted">Acesso restrito ao administrador.</p><form id="form"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><div id="error" class="error"></div></form></section><section id="app"><h1>Visão geral</h1><p class="muted">Dados reais do FUTUROLOGIO™. Visitantes únicos são identificados apenas por um identificador aleatório armazenado no navegador.</p><div class="grid" id="stats"></div><div class="panel"><h2>Usuários cadastrados</h2><div id="users"></div></div></section></main><script>const API='https://motor-invencoes.edsonfernandesvet.workers.dev';const tokenKey='futuro_auth_token';const $=id=>document.getElementById(id);function token(){return localStorage.getItem(tokenKey)||''}function showLogin(){ $('login').style.display='block';$('app').style.display='none';$('logout').style.display='none'}function showApp(){ $('login').style.display='none';$('app').style.display='block';$('logout').style.display='block'}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function catalogCount(){const files=['./catalog.json','./catalog-lote3.json','./catalog-lote4.json','./catalog-lote5.json','./catalog-lote6.json','./catalog-lote7.json','./catalog-lote8.json','./catalog-lote9.json','./catalog-lote10.json','./catalog-lote11.json','./catalog-lote12.json','./catalog-lote13.json','./catalog-lote14.json','./catalog-lote15.json','./catalog-lote16.json','./catalog-lote16-02.json','./catalog-lote16-03.json','./catalog-lote16-04.json','./catalog-lote16-05.json','./catalog-lote16-06.json','./catalog-lote16-07.json','./catalog-lote17.json'];const rs=await Promise.allSettled(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.json()})));const ids=new Set();rs.forEach(r=>{if(r.status==='fulfilled'&&Array.isArray(r.value))r.value.forEach(x=>{if(x&&x.id!=null)ids.add(String(x.id))})});return ids.size}async function load(){const t=token();if(!t){showLogin();return}try{const r=await fetch(API+'/api/admin/stats',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Acesso negado');const s=d.stats;const catalog=await catalogCount();$('stats').innerHTML=[['Usuários cadastrados',s.users],['Além de Edinho',s.other_users],['Visitantes únicos',s.unique_visitors],['Visitas registradas',s.visits],['Criações',s.creations],['Produtos no catálogo',catalog],['Curtidas',s.likes],['Comentários',s.comments],['Uploads',s.uploads]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+Number(x[1]||0).toLocaleString('pt-BR')+'</b></div>').join('');$('users').innerHTML=d.users?.length?'<table><thead><tr><th>Usuário</th><th>E-mail</th><th>Cadastro</th></tr></thead><tbody>'+d.users.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.email)+'</td><td>'+new Date(u.created_at.replace(' ','T')+'Z').toLocaleString('pt-BR')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">Nenhum usuário.</p>';showApp()}catch(e){localStorage.removeItem(tokenKey);showLogin();$('error').textContent=e.message||'Acesso negado.'}}$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Falha no login');localStorage.setItem(tokenKey,d.token);localStorage.setItem('futuro_social_user',JSON.stringify(d.user));await load()}catch(e){$('error').textContent=e.message}};$('logout').onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem('futuro_social_user');showLogin()};showLogin();load();</script></body></html>
