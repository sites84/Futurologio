name: Bust auth frontend cache
on:
  push:
    paths:
      - '.github/workflows/cache-bust-auth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add auth script cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('frontend/auth-gate.js?v=20260907b','frontend/auth-gate.js?v=20260907c')
          if 'frontend/auth-gate.js?v=20260907c' not in s:
              s=s.replace('frontend/auth-gate.js','frontend/auth-gate.js?v=20260907c')
          p.write_text(s)
          PY
          grep -q 'frontend/auth-gate.js?v=20260907c' index.html
          git rm .github/workflows/cache-bust-auth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust auth gate cache'
          git push