name: Validate frontend

on:
  push:
    paths:
      - 'index.html'
      - 'profile.html'
      - 'criar.html'
      - 'frontend/**'
      - '.github/workflows/validate-frontend.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'profile.html'
      - 'criar.html'
      - 'frontend/**'
      - '.github/workflows/validate-frontend.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate external JavaScript files
        run: |
          node --check frontend/auth-gate.js
          node --check frontend/auth-social-bridge.js
          node --check frontend/social.js
          node --check frontend/profile-panel.js
          node --check frontend/gamification.js
          node --check frontend/gamification-events.js
          node --check frontend/game-ui.js
          node --check frontend/home-social.js
          node --check frontend/product-social.js
          node --check frontend/welcome-and-sound.js
          node --check frontend/recent-creations-v2.js
          node --check frontend/profile-nav-v2.js
          node --check frontend/profile-page-v2.js
      - name: Validate critical integration hooks
        run: |
          grep -q 'window.openAuth=openAuth' frontend/auth-gate.js
          grep -q 'FUTUROLOGIO_AFTER_CREATE' frontend/auth-gate.js
          grep -q 'FUTUROLOGIO_DB_ID_FOR' frontend/auth-gate.js
          grep -q 'waitForDbId' frontend/social.js
          grep -q "'?invention='" frontend/social.js
          grep -q 'FUTUROLOGIO_CHECK_REWARDS' frontend/gamification-events.js
          grep -q 'home-social.js' index.html
          grep -q 'recent-creations-v2.js' index.html
          grep -q 'profile-nav-v2.js' index.html
          grep -q 'profile-nav-v2.js' criar.html
          grep -q 'profile-page-v2.js' profile.html
          grep -q 'profile-settings.js' profile.html
          grep -q 'api/recent-creations' frontend/recent-creations-v2.js
          ! grep -q 'recent-feed-fix.js' index.html
          ! grep -q 'profile-top.js' index.html
          ! grep -q 'frontend/profile-page.js' profile.html
          ! grep -q '<section class="panel profile"' criar.html
          ! grep -q 'frontend/recent-feed-fix.js' frontend/welcome-and-sound.js
          ! grep -q 'frontend/profile-top.js' frontend/welcome-and-sound.js
          grep -q 'game-image-card' frontend/game-ui.js
          grep -q 'game-prompt-card' frontend/game-ui.js
          grep -q 'buildPrompt' frontend/game-ui.js
          ! grep -q 'frontend/auth-social-bridge.js' index.html
