name: Fix auth token
on:
  push:
    paths:
      - '.github/workflows/fix-auth-token.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authenticated frontend calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/auth-gate.js')
          s=p.read_text()
          needle="const oldFetch=window.fetch;"
          helper="const oldFetch=window.fetch;\nasync function authFetch(url,init={}){const headers={...(init.headers||{})};const t=token();if(t)headers.Authorization='Bearer '+t;return oldFetch(url,{...init,headers})}"
          if "async function authFetch(" not in s:
              if needle not in s: raise SystemExit('missing oldFetch anchor')
              s=s.replace(needle,helper,1)
          old="oldFetch(API+'/api/consume-creation',{method:'POST',headers:{'content-type':'application/json'}})"
          new="authFetch(API+'/api/consume-creation',{method:'POST',headers:{'content-type':'application/json'}})"
          if old not in s: raise SystemExit('missing consume-creation call')
          s=s.replace(old,new,1)
          old2="oldFetch(API+'/api/record-creation'"
          new2="authFetch(API+'/api/record-creation'"
          if old2 not in s: raise SystemExit('missing record-creation call')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check frontend/auth-gate.js
          grep -q "async function authFetch" frontend/auth-gate.js
          grep -q "authFetch(API+'/api/consume-creation'" frontend/auth-gate.js
          grep -q "authFetch(API+'/api/record-creation'" frontend/auth-gate.js
      - name: Remove one-time patch workflow
        run: git rm .github/workflows/fix-auth-token.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/auth-gate.js
          git commit -m 'Fix authenticated creation requests'
          git push