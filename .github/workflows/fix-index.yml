name: Fix FUTUROLOGIO index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix catalog initialization and persistent creation callback
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(";addHistory({id:''});\n</script>\n<script>", ";\n</script>\n<script>", 1)

          s = re.sub(
              r'async function loadCatalog\(\)\{return PRODUCTS\}.*?</script></body></html>$',
              "window.FUTUROLOGIO_PRODUCTS=PRODUCTS;\n"
              "document.getElementById('createBtn').disabled=false;\n"
              "document.getElementById('createBtn').textContent='CRIAR MEU PRODUTO';\n"
              "addHistory({id:''});\n"
              "</script></body></html>",
              s,
              flags=re.S,
          )

          old = "function newInvention(){const pool=window.FUTUROLOGIO_PRODUCTS.filter(p=>p.category===selected&&!used.includes(p.id));if(!pool.length){alert('Essa categoria já mostrou todos os produtos disponíveis. Escolha outra categoria.');return}show(pool[Math.floor(Math.random()*pool.length)])}"
          new = "function newInvention(){const pool=window.FUTUROLOGIO_PRODUCTS.filter(p=>p.category===selected&&!used.includes(p.id));if(!pool.length){alert('Essa categoria já mostrou todos os produtos disponíveis. Escolha outra categoria.');return}const p=pool[Math.floor(Math.random()*pool.length)];show(p);if(typeof window.FUTUROLOGIO_AFTER_CREATE==='function')window.FUTUROLOGIO_AFTER_CREATE(p)}"
          if old in s:
              s = s.replace(old, new, 1)

          if 'window.FUTUROLOGIO_PRODUCTS=PRODUCTS;' not in s:
              raise SystemExit('Falha: catálogo não inicializado.')
          if old in s:
              raise SystemExit('Falha: callback de criação não foi aplicado.')

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Connect creation to user persistence'
          git push
