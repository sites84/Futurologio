name: Install FUTUROLOGIO modules

on:
  push:
    paths:
      - '.github/workflows/fix-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consolidate frontend modules safely
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'index.html';
          let s = fs.readFileSync(p, 'utf8');

          const keep = [
            '<script src="frontend/auth-gate.js"></script>',
            '<script src="frontend/auth-social-bridge.js"></script>'
          ];
          const remove = [
            '<script src="frontend/social-actions.js"></script>',
            '<script src="frontend/gamification.js"></script>',
            '<script src="./frontend/social.js"></script>',
            '<script src="frontend/profile-panel.js"></script>'
          ];
          for (const tag of [...keep, ...remove]) s = s.split(tag).join('');

          if (!s.includes('window.FUTUROLOGIO_PRODUCTS=PRODUCTS;')) {
            const init = '<script>window.FUTUROLOGIO_PRODUCTS=PRODUCTS;document.getElementById(\'createBtn\').disabled=false;document.getElementById(\'createBtn\').textContent=\'CRIAR MEU PRODUTO\';addHistory({id:\'\'});</script>';
            const pos = s.lastIndexOf('</body>');
            if (pos < 0) throw new Error('body closing tag not found');
            s = s.slice(0, pos) + init + '\n' + s.slice(pos);
          }

          const modules = '\n' + keep.join('\n') + '\n';
          const pos = s.lastIndexOf('</body>');
          if (pos < 0) throw new Error('body closing tag not found');
          s = s.slice(0, pos) + modules + s.slice(pos);
          fs.writeFileSync(p, s);
          NODE

      - name: Validate
        run: |
          node --check backend/worker.js
          node --check backend/roles.js
          node --check frontend/auth-gate.js
          node --check frontend/auth-social-bridge.js
          grep -q 'window.FUTUROLOGIO_PRODUCTS=PRODUCTS;' index.html
          grep -q 'frontend/auth-gate.js' index.html
          grep -q 'frontend/auth-social-bridge.js' index.html
          ! grep -q 'frontend/social-actions.js' index.html
          ! grep -q 'frontend/gamification.js' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Consolidate FUTUROLOGIO frontend modules'
          git push
