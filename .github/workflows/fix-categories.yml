name: Fix FUTUROLOGIO categories
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair catalog categories and usage key
        env:
          CATEGORY_MAP: >-
            {"lote1-001":"Mente & Comportamento","lote1-002":"Comida & Cozinha","lote1-003":"Bizarro ou Nojento","lote1-004":"Casa","lote1-005":"Esportes","lote1-006":"Objetos pessoais","lote1-007":"Objetos pessoais","lote1-008":"Esportes","lote1-009":"Mente & Comportamento","lote1-010":"Mente & Comportamento","lote1-011":"Casa","lote1-012":"Mente & Comportamento","lote1-013":"Mente & Comportamento","lote1-014":"Moda","lote1-015":"Mente & Comportamento","lote1-016":"Mente & Comportamento","lote1-017":"Comida & Cozinha","lote1-018":"Tempo & Clima","lote1-019":"Comida & Cozinha","lote1-020":"Escola & Trabalho","lote1-021":"Tempo & Clima","lote1-022":"Meio Ambiente","lote1-023":"Tecnologia","lote1-024":"Indústria","lote1-025":"Tecnologia","lote1-026":"Mente & Comportamento","lote1-027":"Mente & Comportamento","lote1-028":"Tecnologia do futuro","lote1-029":"Tempo & Clima","lote1-030":"Tecnologia","lote1-031":"Comunicação","lote1-032":"Objetos pessoais","lote1-033":"Agricultura","lote1-034":"Espaço","lote1-035":"Comunicação","lote1-036":"Tempo & Clima","lote1-037":"Tecnologia","lote1-038":"Cidade","lote1-039":"Mente & Comportamento","lote1-040":"Objetos pessoais","lote1-041":"Mente & Comportamento","lote1-042":"Mente & Comportamento","lote1-043":"Casa","lote1-044":"Viagem","lote1-045":"Casa","lote1-046":"Mente & Comportamento","lote1-047":"Lazer","lote1-048":"Viagem","lote1-049":"Casa","lote1-050":"Animais","lote1-051":"Comida & Cozinha","lote1-052":"Mente & Comportamento","lote1-053":"Casa","lote1-054":"Mente & Comportamento","lote1-055":"Escola & Trabalho","lote1-056":"Comida & Cozinha","lote1-057":"Tecnologia do futuro","lote1-058":"Energia","lote1-059":"Museu","lote1-060":"Tecnologia","lote1-061":"Mente & Comportamento","lote1-062":"Tempo & Clima","lote1-063":"Tecnologia","lote1-064":"Cidade","lote1-065":"Comunicação","lote1-066":"Mente & Comportamento","lote1-067":"Mente & Comportamento","lote1-068":"Casa","lote1-069":"Mente & Comportamento","lote1-070":"Mente & Comportamento","lote1-071":"Museu","lote1-072":"Museu","lote1-073":"Mente & Comportamento","lote1-074":"Mente & Comportamento","lote1-075":"Mente & Comportamento","lote1-076":"Mente & Comportamento","lote1-077":"Mente & Comportamento","lote1-078":"Mente & Comportamento","lote1-079":"Mente & Comportamento","lote1-080":"Mente & Comportamento","lote1-081":"Mente & Comportamento","lote1-082":"Mente & Comportamento","lote1-083":"Mente & Comportamento","lote1-084":"Mente & Comportamento","lote2-001":"Sem sentido","lote2-002":"Escola & Trabalho","lote2-003":"Comida & Cozinha","lote2-004":"Casa","lote2-005":"Dinheiro & Negócios","lote2-006":"Entretenimento","lote2-007":"Comunicação","lote2-008":"Casa","lote2-009":"Cidade","lote2-010":"Entretenimento","lote2-011":"Mente & Comportamento","lote2-012":"Viagem","lote2-013":"Objetos pessoais","lote2-014":"Mente & Comportamento","lote2-015":"Casa","lote2-016":"Transporte","lote2-017":"Animais","lote2-018":"Cidade","lote2-019":"Objetos pessoais","lote2-020":"Objetos pessoais","lote2-021":"Escola & Trabalho","lote2-022":"Casa","lote2-023":"Moda","lote2-024":"Casa","lote2-025":"Objetos pessoais","lote2-026":"Moda","lote2-027":"Mente & Comportamento","lote2-028":"Objetos pessoais","lote2-029":"Escola & Trabalho","lote2-030":"Comida & Cozinha","lote2-031":"Entretenimento","lote2-032":"Mente & Comportamento","lote2-033":"Dinheiro & Negócios","lote2-034":"Mente & Comportamento","lote2-035":"Escola & Trabalho","lote2-036":"Transporte","lote2-037":"Museu","lote2-038":"Comunicação","lote2-039":"Cidade","lote2-040":"Escola & Trabalho","lote2-041":"Entretenimento","lote2-042":"Entretenimento","lote2-043":"Dinheiro & Negócios","lote2-044":"Viagem","lote2-045":"Entretenimento","lote2-046":"Comunicação","lote2-047":"Escola & Trabalho","lote2-048":"Dinheiro & Negócios","lote2-049":"Tecnologia","lote2-050":"Mente & Comportamento","lote2-051":"Mente & Comportamento","lote2-052":"Escola & Trabalho","lote2-053":"Escola & Trabalho","lote2-054":"Objetos pessoais","lote2-055":"Escola & Trabalho"}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          m = re.search(r'const PRODUCTS=(\[.*?\]);\s*window\.FUTUROLOGIO_PRODUCTS', s, re.S)
          if not m:
              raise SystemExit('PRODUCTS array not found')
          products = json.loads(m.group(1))
          if len(products) != 139:
              raise SystemExit(f'Expected 139 products, found {len(products)}')
          cmap = json.loads(os.environ['CATEGORY_MAP'])
          if len(cmap) != 139:
              raise SystemExit(f'Expected 139 category mappings, found {len(cmap)}')
          for p in products:
              if p['id'] not in cmap:
                  raise SystemExit(f'Missing category for {p["id"]}')
              p['category'] = cmap[p['id']]
          cats = {p['category'] for p in products}
          required = {'Casa','Comida & Cozinha','Transporte','Moda','Animais','Tecnologia','Mente & Comportamento','Meio Ambiente','Escola & Trabalho','Espaço','Sem sentido','Tecnologia do futuro','Indústria','Esportes','Entretenimento','Dinheiro & Negócios','Cidade','Agricultura','Viagem','Comunicação','Energia','Tempo & Clima','Objetos pessoais','Lazer','Museu','Bizarro ou Nojento'}
          missing = required - cats
          if missing:
              raise SystemExit('Categories without products: ' + ', '.join(sorted(missing)))
          arr = json.dumps(products, ensure_ascii=False, separators=(',', ':'))
          s = s[:m.start(1)] + arr + s[m.end(1):]
          s = s.replace("futuro_used_v2", "futuro_used_v3")
          path.write_text(s, encoding='utf-8')
          print('OK:', len(products), 'products;', len(cats), 'categories')
          PY
      - name: Validate and commit
        run: |
          grep -q 'window.FUTUROLOGIO_PRODUCTS=PRODUCTS' index.html
          grep -q 'futuro_used_v3' index.html
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair all FUTUROLOGIO categories'
          git push
