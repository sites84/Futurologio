name: Inspect worker social badge

on:
  push:
    paths:
      - '.github/workflows/inspect-worker.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant worker sections
        run: |
          grep -n -o '.\{0,220\}HUNDRED_LIKES_RECEIVED.\{0,300\}' backend/worker.js || true
          grep -n -o '.\{0,180\}/like.\{0,500\}' backend/worker.js || true
          grep -n -o '.\{0,180\}awardBadges.\{0,500\}' backend/worker.js || true
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-worker.yml
          git commit -m 'Remove temporary worker inspection workflow'
          git push
