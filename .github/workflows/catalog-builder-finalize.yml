name: Finalize catalog Builder import
on:
  workflow_run:
    workflows: [Build catalog master]
    types: [completed]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/finalize_catalog_builder_import.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('catalog.json',encoding='utf-8'))
          ids=[x.get('id') for x in p]
          assert len(p)==196 and len(ids)==len(set(ids))
          for i in range(156,197): assert f'produto-{i}' in ids
          n={x['id']:x['name'] for x in p}
          assert n['produto-188']=='PEDAL DE URGÊNCIA FICTÍCIA™'
          assert n['produto-189']=='VÁLVULA DE RISO SECO™'
          assert n['produto-190']=='METRÔNOMO DE DESVIO™'
          assert n['produto-193']=='BLOQUEADOR DE DESPEDIDA™'
          assert n['produto-194']=='FILTRO DE DEDADA TRAIDORA™'
          assert n['produto-195']=='GUILHOTINA CARBOIDRATO™'
          assert n['produto-196']=='RADAR DE LUTO ALHEIO™'
          print('OK',len(p))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json catalog-master-migration-report.json
          git commit -m 'catalog-master: add products 193-196 [catalog-master]' || exit 0
          git push
