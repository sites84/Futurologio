name: Enable FUTUROLOGIO tester mode

on:
  push:
    paths:
      - '.github/workflows/enable-tester-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable tester access
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/worker.js')
          s = p.read_text()
          replacements = [
            (
              "const GOOGLE_TOKENINFO='https://oauth2.googleapis.com/tokeninfo?id_token=';",
              "const GOOGLE_TOKENINFO='https://oauth2.googleapis.com/tokeninfo?id_token=';const TESTER_EMAIL='edsonfernandesvet@gmail.com';const isTester=u=>String(u?.email||'').trim().toLowerCase()===TESTER_EMAIL;"
            ),
            (
              "async function allowance(db,u){const d=today();let used=Number(u.daily_creations||0);",
              "async function allowance(db,u){if(isTester(u))return {used:0,base:null,credits:0,remaining:null,unlimited:true};const d=today();let used=Number(u.daily_creations||0);"
            ),
            (
              "function pub(u,a){return {id:u.id,username:u.username,email:u.email,avatar:u.avatar,...roleData(Number(u.xp||0)),plan:u.plan,allowance:a}}",
              "function pub(u,a){return {id:u.id,username:u.username,email:u.email,avatar:u.avatar,...roleData(Number(u.xp||0)),plan:isTester(u)?'tester':u.plan,tester:isTester(u),allowance:a}}"
            ),
            (
              "async function xp(db,u,type,refType,refId){const lim=DAILY_XP_LIMITS[type];if(lim){",
              "async function xp(db,u,type,refType,refId){const lim=isTester(u)?null:DAILY_XP_LIMITS[type];if(lim){"
            ),
            (
              "const a=await allowance(env.DB,u);if(a.remaining<=0)return json({ok:false,error:'Limite diário de criações atingido',allowance:a},429);let r;if(a.used<a.base)",
              "const a=await allowance(env.DB,u);if(!a.unlimited&&a.remaining<=0)return json({ok:false,error:'Limite diário de criações atingido',allowance:a},429);if(a.unlimited){return json({ok:true,allowance:a})}let r;if(a.used<a.base)"
            ),
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected text: {old[:100]}')
            s=s.replace(old,new,1)
          p.write_text(s)
      - name: Validate worker syntax
        run: node --check backend/worker.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/worker.js .github/workflows/enable-tester-mode.yml
          git commit -m 'Enable private tester mode for FUTUROLOGIO' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/enable-tester-mode.yml || true
          git commit -m 'Remove one-time tester workflow' || true
          git push || true
