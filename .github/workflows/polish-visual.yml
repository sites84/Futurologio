name: Polish FUTUROLOGIO visual
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/polish-visual.yml'

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visual polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
          body{background:radial-gradient(circle at 15% 10%,rgba(216,255,85,.18),transparent 28%),radial-gradient(circle at 90% 35%,rgba(223,245,255,.35),transparent 30%),var(--bg)}
          .hero{position:relative;overflow:hidden}.hero:before{content:"✦  ◇  ✦";position:absolute;right:3%;top:8%;font-size:28px;font-weight:950;letter-spacing:14px;opacity:.16;transform:rotate(-8deg)}
          .hero h1{text-shadow:3px 3px 0 rgba(216,255,85,.65)}
          .panel{transition:transform .2s ease,box-shadow .2s ease}.panel:hover{box-shadow:9px 9px 0 var(--ink)}
          .cat{position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}.cat:after{content:"";position:absolute;right:9px;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--lime);border:1px solid var(--ink);opacity:.7}.cat:hover{box-shadow:3px 3px 0 var(--ink)}
          .cat.selected{box-shadow:3px 3px 0 var(--ink)}
          .create{letter-spacing:.02em;box-shadow:4px 4px 0 var(--lime);transition:transform .15s ease,box-shadow .15s ease}.create:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--lime)}
          .result .panel{background:linear-gradient(145deg,var(--paper),#fff)}.result .tag{box-shadow:2px 2px 0 var(--ink)}
          .result h2{max-width:900px}.fact,.card{transition:transform .16s ease,box-shadow .16s ease}.fact:hover,.card:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--line)}
          .share{position:sticky;bottom:12px;z-index:5;padding:8px;border-radius:16px;background:rgba(245,242,234,.86);backdrop-filter:blur(8px)}
          .primary,.secondary{transition:transform .15s ease,box-shadow .15s ease}.primary:hover,.secondary:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
          .history span{transition:transform .15s ease}.history span:hover{transform:translateY(-2px);border-color:var(--ink)}
          @media(max-width:760px){.hero:before{font-size:18px;right:-8%;top:2%}.panel:hover{box-shadow:4px 4px 0 var(--ink)}.share{bottom:6px}}
          '''
          marker='</style>'
          if css not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Polish FUTUROLOGIO visual design' || true
          git rm .github/workflows/polish-visual.yml
          git commit -m 'Remove temporary visual polish workflow'
          git push
