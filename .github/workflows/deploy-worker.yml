name: Deploy FUTUROLOGIO Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION: ${{ secrets.SESSION_SECRET }}
          GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$SESSION" || { echo 'Missing SESSION_SECRET'; exit 1; }
          test -n "$GOOGLE" || { echo 'Missing GOOGLE_CLIENT_ID'; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Resolve D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          LIST="$(wrangler d1 list --json)"
          ID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(x=>x.name==='futurologio');if(!x)process.exit(2);process.stdout.write(x.uuid||x.database_id||'')})")" || true
          if [ -z "$ID" ]; then
            wrangler d1 create futurologio --experimental-backend
            LIST="$(wrangler d1 list --json)"
            ID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(x=>x.name==='futurologio');if(!x)process.exit(2);process.stdout.write(x.uuid||x.database_id||'')})")"
          fi
          test -n "$ID"
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Write deployment config
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > backend/wrangler.deploy.toml <<EOF
          name = "futurologio-social-api"
          main = "worker.js"
          compatibility_date = "2026-09-07"
          [[d1_databases]]
          binding = "DB"
          database_name = "futurologio"
          database_id = "$D1_ID"
          migrations_dir = "migrations"
          EOF

      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply futurologio --remote --config wrangler.deploy.toml

      - name: Set session secret
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: printf '%s' "$SESSION_SECRET" | wrangler secret put SESSION_SECRET --config wrangler.deploy.toml

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: wrangler deploy --config wrangler.deploy.toml --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"
