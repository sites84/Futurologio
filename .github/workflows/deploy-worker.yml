name: Deploy FUTUROLOGIO Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Resolve D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          EXPECTED='da4de59f-2f02-434c-a10f-d9d1a5262e95'
          LIST="$(wrangler d1 list --json)"
          ID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(x=>x.name==='futurologio');if(!x)process.exit(2);process.stdout.write(x.uuid||x.database_id||'')})")"
          test "$ID" = "$EXPECTED" || { echo "Unexpected futurologio D1 id: $ID"; exit 1; }
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Write deployment config
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > backend/wrangler.deploy.toml <<EOF
          name = "motor-invencoes"
          main = "worker.js"
          compatibility_date = "2026-09-07"
          [[d1_databases]]
          binding = "DB"
          database_name = "futurologio"
          database_id = "$D1_ID"
          migrations_dir = "migrations"
          [[r2_buckets]]
          binding = "IMAGES"
          bucket_name = "futurologio-images"
          EOF

      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply futurologio --remote --config wrangler.deploy.toml

      - name: Seed badges
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute futurologio --remote --file=seed.sql --config wrangler.deploy.toml

      - name: Patch protected routes
        run: |
          set -e
          node backend/patch-admin-routes.mjs
          node backend/patch-image-routes.mjs
          node backend/patch-share-preview.mjs
          node backend/patch-avatar-routes.mjs
          node backend/patch-views-routes.mjs
          node backend/patch-social-upgrades.mjs
          node backend/patch-daily-credits.mjs
          node --check backend/worker.js

      - name: Bootstrap standalone catalog file
        run: |
          set -e
          if [ ! -f catalog.json ]; then
            node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=html.match(/const PRODUCTS=(\\[.*?\\]);/s);if(!m)throw new Error('PRODUCTS catalog not found in index.html');const products=JSON.parse(m[1]);if(products.length<139)throw new Error('Catalog unexpectedly small: '+products.length);fs.writeFileSync('catalog.json',JSON.stringify(products,null,2)+'\\n');console.log('Created standalone catalog with '+products.length+' products.');"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalog.json
            git commit -m 'Add standalone FUTUROLOGIO catalog'
            git push
          else
            echo 'Standalone catalog already exists.'
          fi

      - name: Seed catalog from standalone file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          node -e "const fs=require('fs'),crypto=require('crypto');const products=JSON.parse(fs.readFileSync('catalog.json','utf8'));if(products.length<139)throw new Error('Catalog unexpectedly small: '+products.length);const q=v=>String(v??'').replace(/'/g,\"''\");const norm=v=>String(v??'').toLowerCase().replace(/\\s+/g,' ').trim();const sql=products.map(p=>{const fp=crypto.createHash('sha256').update(norm(p.name+'|'+p.category+'|'+(p.what||''))).digest('hex');const slug=(String(p.name).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||'produto')+'-'+p.id;const data=JSON.stringify({source_id:p.id,what:p.what||'',realTech:p.realTech||'',specTech:p.specTech||'',inventedTech:p.inventedTech||'',build:p.build||'',uses:p.uses||'',dangers:p.dangers||'',test:p.test||p.tests||'',curiosity:p.curiosity||'',readiness:p.readiness||'',year:p.year||'',patent:p.patent||''});return \"INSERT OR IGNORE INTO INVENTIONS(slug,name,category,concept,fingerprint,data) VALUES('\"+q(slug)+\"','\"+q(p.name)+\"','\"+q(p.category)+\"','\"+q(p.what||p.name)+\"','\"+q(fp)+\"','\"+q(data)+\"');\"}).join('\\n');fs.writeFileSync('backend/catalog_seed.sql','-- Generated from catalog.json\\n'+sql+'\\n');console.log('Prepared '+products.length+' catalog rows.');"
          wrangler d1 execute futurologio --remote --file=backend/catalog_seed.sql --config=backend/wrangler.deploy.toml

      - name: Preserve session secret
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if wrangler secret list --config wrangler.deploy.toml | grep -q 'SESSION_SECRET'; then
            echo 'SESSION_SECRET already exists; preserving it.'
          else
            echo 'SESSION_SECRET missing; generating it once.'
            openssl rand -hex 32 | wrangler secret put SESSION_SECRET --config wrangler.deploy.toml
          fi

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.deploy.toml

      - name: Verify live Worker
        run: |
          set -e
          curl --fail --silent --show-error --retry 8 --retry-delay 3 https://motor-invencoes.edsonfernandesvet.workers.dev/api/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 3 https://motor-invencoes.edsonfernandesvet.workers.dev/api/categories
          echo
