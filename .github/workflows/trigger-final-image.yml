name: Trigger final image gallery
on:
  push:
    paths:
      - '.github/workflows/trigger-final-image.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch game UI
        run: |
          printf '\n/* final image gallery patch trigger */\n' >> frontend/game-ui.js
      - name: Commit touch and remove trigger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/game-ui.js
          git rm .github/workflows/trigger-final-image.yml
          git commit -m 'Trigger final image gallery patch'
          git push
