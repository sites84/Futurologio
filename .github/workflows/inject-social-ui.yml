name: Inject FUTUROLOGIO social UI

on:
  push:
    paths:
      - 'frontend/social.js'
      - '.github/workflows/inject-social-ui.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject social script into index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./frontend/social.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Validate injection
        run: |
          grep -q '<script src="./frontend/social.js"></script>' index.html
          test -s frontend/social.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect visible social UI to FUTUROLOGIO site'
          git push
