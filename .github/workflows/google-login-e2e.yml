name: Google login E2E
on:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test live Google button
        run: |
          sleep 45
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://sites84.github.io/Futurologio/criar.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#ftGateModal',{state:'visible',timeout:20000});
            await page.waitForSelector('#ftGoogleLogin iframe',{state:'visible',timeout:30000});
            console.log('Google button rendered on live site.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE