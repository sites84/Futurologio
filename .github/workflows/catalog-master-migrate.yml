name: Build catalog master

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[catalog-master]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous master as migration input
        run: |
          git show HEAD^:catalog.json > catalog.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build master catalog
        run: python scripts/migrate_catalog_master.py
      - name: Commit master catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json catalog-master-migration-report.json
          if git diff --cached --quiet; then
            echo 'Master catalog already current.'
            exit 0
          fi
          git commit -m 'catalog-master: migrate all validated products [catalog-master]'
          git push
