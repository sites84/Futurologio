name: Patch community gallery
on:
  push:
    paths: ['frontend/explore.js','frontend/image-ai-links.js','frontend/public-invention.js']
permissions: {contents: write}
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove community gallery patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/worker.js');s=p.read_text()
          s=s.replace("uploads:await q(\"SELECT COUNT(*) n FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id WHERE o.user_id=? AND i.image_source='upload'\")","uploads:await q(\"SELECT COUNT(*) n FROM XP_EVENTS WHERE user_id=? AND event_type='upload'\")",1)
          s=s.replace("(type==='like'||type==='share'||type==='upload')&&refType&&refId","(type==='like'||type==='share')&&refType&&refId",1)
          marker="const session=await auth(request,env);"
          routes="""if(path==='/api/explore'&&request.method==='GET'){const mode=url.searchParams.get('mode')==='week'?'week':'recent',limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12))),week=\"(SELECT COUNT(*) FROM LIKES wl WHERE wl.invention_id=i.id AND wl.created_at>=datetime('now','-6 days'))\",where=mode==='week'?`WHERE ${week}>0`:'',order=mode==='week'?`${week} DESC,i.created_at DESC`:'i.created_at DESC';const rows=await env.DB.prepare(`SELECT i.id,i.name,i.category,i.concept,i.data,i.image_key,u.id user_id,u.username,u.avatar,(SELECT COUNT(*) FROM LIKES l WHERE l.invention_id=i.id) likes,(SELECT COUNT(*) FROM COMMENTS c WHERE c.invention_id=i.id) comments,${week} week_likes FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id JOIN USERS u ON u.id=o.user_id ${where} ORDER BY ${order} LIMIT ?`).bind(limit).all();const items=(rows.results||[]).map(r=>{let d={};try{d=JSON.parse(r.data||'{}')}catch{};return {...r,source_id:d.source_id||null,image_url:r.image_key?`${url.origin}/api/invention-image/${r.id}`:null}});return json({ok:true,items})}if(path.startsWith('/api/invention/')&&request.method==='GET'){const id=Number(path.split('/').pop());if(!Number.isInteger(id)||id<1)return json({error:'Invenção não encontrada.'},404);const r=await env.DB.prepare(`SELECT i.id,i.name,i.category,i.concept,i.data,i.image_key,u.id user_id,u.username,u.avatar,(SELECT COUNT(*) FROM LIKES l WHERE l.invention_id=i.id) likes,(SELECT COUNT(*) FROM COMMENTS c WHERE c.invention_id=i.id) comments FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id JOIN USERS u ON u.id=o.user_id WHERE i.id=?`).bind(id).first();if(!r)return json({error:'Invenção não encontrada.'},404);let data={};try{data=JSON.parse(r.data||'{}')}catch{};return json({ok:true,id:r.id,name:r.name,category:r.category,concept:r.concept,source_id:data.source_id||null,data,user:{id:r.user_id,username:r.username,avatar:r.avatar},likes:Number(r.likes||0),comments:Number(r.comments||0),image_url:r.image_key?`${url.origin}/api/invention-image/${r.id}`:null})} """
          s=s.replace(marker,routes+marker,1)
          me="if(path==='/api/me'&&request.method==='GET'){"
          mine="""if(path==='/api/my-inventions'&&request.method==='GET'){if(!session)return json({error:'Não autenticado'},401);const limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12)));const rows=await env.DB.prepare(`SELECT i.id,i.name,i.category,i.concept,i.data,i.image_key,u.id user_id,u.username,u.avatar,(SELECT COUNT(*) FROM LIKES l WHERE l.invention_id=i.id) likes,(SELECT COUNT(*) FROM COMMENTS c WHERE c.invention_id=i.id) comments FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id JOIN USERS u ON u.id=o.user_id WHERE o.user_id=? ORDER BY o.created_at DESC LIMIT ?`).bind(session.sub,limit).all();const items=(rows.results||[]).map(r=>{let d={};try{d=JSON.parse(r.data||'{}')}catch{};return {...r,source_id:d.source_id||null,image_url:r.image_key?`${url.origin}/api/invention-image/${r.id}`:null}});return json({ok:true,items})} """
          s=s.replace(me,mine+me,1)
          p.write_text(s)
          i=Path('index.html');h=i.read_text()
          for x in ['frontend/explore.js','frontend/image-ai-links.js','frontend/public-invention.js']:
            if x not in h:h=h.replace('</body>',f'<script src="{x}"></script></body>',1)
          i.write_text(h)
          PY
          node --check backend/worker.js
          node --check frontend/explore.js
          node --check frontend/image-ai-links.js
          node --check frontend/public-invention.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/worker.js index.html
          git commit -m 'Add public invention gallery and access'
          git push
      - run: |
          git rm .github/workflows/patch-community-gallery.yml
          git commit -m 'Remove community gallery patch workflow'
          git push
