name: Patch deploy R2 step
on:
  push:
    paths: ['backend/.deploy-trigger-20260908']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-worker.yml');s=p.read_text()
          a=s.index("      - name: Ensure R2 image bucket exists\n")
          b=s.index("      - name: Write deployment config\n",a)
          s=s[:a]+s[b:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-worker.yml
          git commit -m 'Skip R2 bucket API check during deploy'
          git push
      - run: |
          git rm .github/workflows/patch-deploy-r2-step.yml
          git commit -m 'Remove deploy R2 patch workflow'
          git push
