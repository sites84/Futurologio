name: Inspect worker social endpoints

on:
  push:
    paths:
      - '.github/workflows/inspect-worker-2.yml'
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print social route context
        run: |
          node <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('backend/worker.js','utf8');
          for(const term of ['/like','like(',"/comment","/share",'SHARES','LIKES']){let p=-1,n=0;while((p=s.indexOf(term,p+1))>=0&&n++<8)console.log('\nTERM',term,'\n',s.slice(Math.max(0,p-700),Math.min(s.length,p+1200)));}
          NODE
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-worker-2.yml
          git commit -m 'Remove second temporary worker inspection workflow'
          git push
