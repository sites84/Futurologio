name: Install FUTUROLOGIO automatic badges

on:
  push:
    paths:
      - 'backend/worker.js'
      - 'backend/seed.sql'
      - '.github/workflows/install-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install badge engine
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/worker.js')
          s=p.read_text(encoding='utf-8')
          if 'async function awardBadges(' not in s:
              marker="function b64(x){return btoa(String.fromCharCode(...new Uint8Array(x)))}"
              fn="""async function awardBadges(db,userId){
  const count=async sql=>Number((await db.prepare(sql).bind(userId).first())?.n||0);
  const creations=await count('SELECT COUNT(*) n FROM USER_INVENTIONS WHERE user_id=?');
  const likes=await count('SELECT COUNT(*) n FROM LIKES WHERE user_id=?');
  const comments=await count('SELECT COUNT(*) n FROM COMMENTS WHERE user_id=?');
  const shares=await count('SELECT COUNT(*) n FROM SHARES WHERE user_id=?');
  const categories=await count('SELECT COUNT(DISTINCT i.category) n FROM USER_INVENTIONS ui JOIN INVENTIONS i ON i.id=ui.invention_id WHERE ui.user_id=?');
  const bizarre=await count(\"SELECT COUNT(*) n FROM USER_INVENTIONS ui JOIN INVENTIONS i ON i.id=ui.invention_id WHERE ui.user_id=? AND i.category='Bizarro ou Nojento'\");
  const received=await count('SELECT COUNT(*) n FROM LIKES l JOIN USER_INVENTIONS ui ON ui.invention_id=l.invention_id WHERE ui.user_id=?');
  const rules=[
    ['FIRST_CREATION',creations>=1],['TEN_CREATIONS',creations>=10],['FIFTY_CREATIONS',creations>=50],
    ['FIRST_LIKE',likes>=1],['HUNDRED_LIKES_RECEIVED',received>=100],['FIRST_COMMENT',comments>=1],
    ['FIFTY_COMMENTS',comments>=50],['FIRST_SHARE',shares>=1],['FIFTY_SHARES',shares>=50],
    ['CATEGORY_EXPLORER',categories>=10],['MULTICATEGORY_CREATOR',categories>=20],['BIZARRO_EXPLORER',bizarre>=1]
  ];
  for(const [code,ok] of rules){
    if(!ok)continue;
    const b=await db.prepare('SELECT id FROM BADGES WHERE code=?').bind(code).first();
    if(b)await db.prepare('INSERT OR IGNORE INTO USER_BADGES(user_id,badge_id) VALUES(?,?)').bind(userId,b.id).run();
  }
}
"""
              if marker not in s: raise SystemExit('Badge insertion marker not found')
              s=s.replace(marker,fn+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Install badge hooks
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/worker.js')
          s=p.read_text(encoding='utf-8')
          old="const v=await user(db,u.id);return {granted:amount,limited:false,user:roleData(v.xp)}}"
          new="const v=await user(db,u.id);await awardBadges(db,u.id);return {granted:amount,limited:false,user:roleData(v.xp)}}"
          if old in s and new not in s:s=s.replace(old,new,1)
          old2="await env.DB.prepare('INSERT INTO LIKES(user_id,invention_id) VALUES(?,?)').bind(u.id,iid).run();return json({ok:true,liked:true,xp:await xp(env.DB,u,'like','invention',iid)})"
          new2="await env.DB.prepare('INSERT INTO LIKES(user_id,invention_id) VALUES(?,?)').bind(u.id,iid).run();const owner=await env.DB.prepare('SELECT user_id FROM USER_INVENTIONS WHERE invention_id=? LIMIT 1').bind(iid).first();const gain=await xp(env.DB,u,'like','invention',iid);await awardBadges(env.DB,u.id);if(owner?.user_id)await awardBadges(env.DB,owner.user_id);return json({ok:true,liked:true,xp:gain})"
          if old2 in s and new2 not in s:s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: node --check backend/worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add backend/worker.js .github/workflows/install-badges.yml
          git diff --cached --quiet || git commit -m 'Add automatic FUTUROLOGIO badge awards'
          git push
