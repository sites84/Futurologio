name: Patch public profile
on:
  push:
    paths: ['frontend/explore.js','frontend/public-profile.js']
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove public profile patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/worker.js');s=p.read_text()
          old="const mode=url.searchParams.get('mode')==='week'?'week':'recent',limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12))),week="
          new="const mode=url.searchParams.get('mode')==='week'?'week':'recent',userFilter=url.searchParams.get('user')||'',limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12))),week="
          if old not in s: raise SystemExit('explore anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("where=mode==='week'?`WHERE ${week}>0`:''","where=(userFilter?`WHERE o.user_id='${userFilter.replaceAll(\"'\",\"''\")}'`:'')+(mode==='week'?(userFilter?' AND ':'WHERE ')+`${week}>0`:'')",1)
          p.write_text(s)
          i=Path('index.html');h=i.read_text();tag='<script src="frontend/public-profile.js"></script>'
          if 'frontend/public-profile.js' not in h:h=h.replace('</body>',tag+'</body>',1)
          i.write_text(h)
          PY
          node --check backend/worker.js
          node --check frontend/public-profile.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/worker.js index.html
          git commit -m 'Add public creator profile access'
          git push
      - run: |
          git rm .github/workflows/patch-public-profile.yml
          git commit -m 'Remove public profile patch workflow'
          git push
