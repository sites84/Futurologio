name: Finalize Biblioteca 3 catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chunks and build 95-product catalog
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),crypto=require('crypto');
          const files=Array.from({length:16},(_,i)=>`catalog-lote3-part${String(i+1).padStart(2,'0')}.b64`);
          const expected=['f4efdc363dee4dc1bf00dd2e41718ea90b3c5c31','583cd470cab4ff2965dfafcc0b4998343d3b21f6','78a9e9d7d637ec382e8b3a642bf421f213c702d9','9200c0735a98d013168b36458bd4a48bd3e6c4b8','30fe7d00bdcb430ae904e570774fe15aa18c5998','11417e7e1c8fb2d4b6da7447b590d5461af5b897','5cf23a351584fabc3cc97b3a4c8e0b441d25d2da','9ba48150a8bb0c475672cf46b086199a0508b754','9811398f2ea57381cd5234f277a94c1443d96332','b7305713620415ac18aae0bb1de640015d027075','181bfd134437fb31140354793b58fecc37496353','c8ff17052ca9e86132fc9631c8dd7885d2c551ae','157263bbf1ef7c9142800f95cfca5dfdec7248b8','7682cdc7caf4e40ced9bd6402ef0ad7e15a254a2','12be9910c2135256dd678b01eb20f57907949e15','15ae27bcb1a86f3381528eb233cc2f386277847a'];
          const bad=[];
          for(let i=0;i<files.length;i++){
            let b=fs.readFileSync(files[i]);
            if(i===13 && b.toString().endsWith('---')){b=b.subarray(0,b.length-3);fs.writeFileSync(files[i],b);}
            const sha=crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');
            if(sha!==expected[i]) bad.push(`${files[i]} expected=${expected[i]} got=${sha}`);
          }
          if(bad.length){console.error('CHUNK_HASH_MISMATCHES');bad.forEach(x=>console.error(x));process.exit(2)}
          const b64=files.map(f=>fs.readFileSync(f,'utf8')).join('').replace(/\s+/g,'');
          const text=zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8');
          const items=JSON.parse(text);
          if(!Array.isArray(items)||items.length!==95) throw new Error('expected 95 new products, got '+(Array.isArray(items)?items.length:'non-array'));
          const required=['id','name','what','realTech','specTech','inventedTech','build','uses','dangers','curiosity','tests','category','readiness','year','patent'];
          for(const [i,p] of items.entries()){
            if(p.id!==`lote3-${String(i+1).padStart(3,'0')}`) throw new Error('bad id at '+i+': '+p.id);
            for(const k of required) if(typeof p[k]!=='string'||!p[k].trim()) throw new Error(`empty field ${k} in ${p.id}`);
          }
          if(new Set(items.map(p=>p.id)).size!==95||new Set(items.map(p=>p.name)).size!==95) throw new Error('duplicate IDs or names in Biblioteca 3');
          const hash=crypto.createHash('sha256').update(text).digest('hex');
          if(hash!=='cea3a3095cee0de6c44718f9799b279defa93f89b26d234d8f9fe50df79bcca7') throw new Error('catalog JSON hash mismatch '+hash);
          const base=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          if(!Array.isArray(base)||base.length!==139) throw new Error('base catalog is not 139 products');
          const all=base.concat(items);
          if(new Set(all.map(p=>String(p.id))).size!==234) throw new Error('duplicate ID across 139+95 catalog');
          if(new Set(all.map(p=>String(p.name))).size!==234) throw new Error('duplicate title across 139+95 catalog');
          fs.writeFileSync('catalog-lote3.json',text+'\n');
          console.log(`VALIDATED base=${base.length} new=${items.length} total=${all.length}`);
          NODE
      - name: Commit finalized catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-lote3.json catalog-lote3-part14.b64
          if git diff --cached --quiet; then echo "No catalog changes to commit"; else git commit -m "Finalize Biblioteca 3 catalog [skip ci]"; git push; fi
