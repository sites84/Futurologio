name: Fix FUTUROLOGIO auth bridge

on:
  push:
    paths:
      - '.github/workflows/fix-auth-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove legacy login override
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bridge = 'frontend/auth-social-bridge.js';
          fs.writeFileSync(bridge, "(() => {\n  'use strict';\n  // Authentication is owned by social.js/auth-gate.js.\n})();\n");
          const p = 'index.html';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('<script src="frontend/auth-social-bridge.js"></script>', '');
          fs.writeFileSync(p, s);
          NODE
      - name: Validate
        run: |
          node --check frontend/auth-social-bridge.js
          node --check frontend/auth-gate.js
          grep -q 'frontend/auth-gate.js' index.html
          ! grep -q 'frontend/auth-social-bridge.js' index.html
      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html frontend/auth-social-bridge.js .github/workflows/fix-auth-bridge.yml
          git rm .github/workflows/fix-auth-bridge.yml
          git diff --cached --quiet || git commit -m 'Fix FUTUROLOGIO authentication bridge'
          git push
