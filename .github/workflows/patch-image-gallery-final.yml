name: Prepare image AI and public gallery finalization
on:
  push:
    paths:
      - 'frontend/game-ui.js'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize image AI and gallery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Upload XP: +5 XP, max 10 XP/day from uploads.
          p=Path('backend/roles.js'); s=p.read_text()
          s=s.replace("  share: 2\n});", "  share: 2,\n  upload: 5\n});")
          s=s.replace("  share: 10\n});", "  share: 10,\n  upload: 10\n});")
          p.write_text(s)

          # Allow public-profile.js to request a creator's inventions through /api/explore?user=...
          p=Path('backend/worker.js'); s=p.read_text()
          old="const mode=url.searchParams.get('mode')==='week'?'week':'recent',limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12))),week="
          if old in s and "userFilter=url.searchParams.get('user')" not in s:
              s=s.replace(old,"const mode=url.searchParams.get('mode')==='week'?'week':'recent',userFilter=String(url.searchParams.get('user')||'').replace(/[^a-zA-Z0-9_-]/g,''),limit=Math.min(24,Math.max(1,Number(url.searchParams.get('limit')||12))),week=",1)
              s=s.replace("where=mode==='week'?`WHERE ${week}>0`:''","where=(userFilter?`WHERE o.user_id='${userFilter}'`:'')+(mode==='week'?(userFilter?' AND ':'WHERE ')+`${week}>0`:'')",1)
              s=s.replace(".bind(limit).all()",".bind(limit).all()",1)
              p.write_text(s)

          # Remove obsolete alternate style source code and force the single official FUTUROLOGIO style.
          p=Path('frontend/game-ui.js'); s=p.read_text()
          s=re.sub(r"\n\s*const styles=\{.*?\n\s*function buildPrompt", "\n  function buildPrompt", s, count=1, flags=re.S)
          s=s.replace("ESTILO FUTUROLOGIO: ${styleDescriptions[selectedStyle]}","ESTILO OFICIAL FUTUROLOGIO: 3D TOY-TECH ABSURDO — único estilo visual do site, usado de forma consistente em todas as invenções. Visual de produto 3D premium, aparência de brinquedo colecionável sofisticado, materiais plásticos e metálicos, iluminação de estúdio, cores neon controladas, formas exageradas e humor visual elegante.")
          s=s.replace("Escolha um estilo ou use o estilo oficial recomendado.","Use sempre o estilo oficial FUTUROLOGIO para manter a identidade visual do catálogo.")
          s=s.replace("<div class=\"game-style-row\"><button class=\"game-style-btn active\" data-style=\"toy\">3D Toy-Tech</button><button class=\"game-style-btn\" data-style=\"retro\">Publicidade Retrô</button><button class=\"game-style-btn\" data-style=\"comic\">HQ Pop</button></div>","")
          p.write_text(s)
          PY
          node --check backend/worker.js
          node --check backend/roles.js
          node --check frontend/game-ui.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/worker.js backend/roles.js frontend/game-ui.js
          git rm .github/workflows/patch-image-gallery-final.yml
          git commit -m 'Finalize image AI and gallery'
          git push
