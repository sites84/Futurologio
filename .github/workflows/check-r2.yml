name: Check R2 bucket
on:
  push:
    paths:
      - '.github/workflows/check-r2.yml'
permissions:
  contents: write
jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, 'Remove R2 check workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global wrangler@latest
      - name: List R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 bucket list
      - name: Remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/check-r2.yml
          git commit -m 'Remove R2 check workflow'
          git push
