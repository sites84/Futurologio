name: Cache bust gamification UI
on:
  push:
    paths:
      - 'frontend/gamification.js'
      - '.github/workflows/cache-bust-gamification.yml'

jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gamification script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='frontend/gamification.js'
          new='frontend/gamification.js?v=20260908b'
          if old in s and new not in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Refresh gamification UI cache' || true
          git rm .github/workflows/cache-bust-gamification.yml
          git commit -m 'Remove temporary gamification cache workflow'
          git push
