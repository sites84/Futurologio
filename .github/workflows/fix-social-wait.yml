name: Fix FUTUROLOGIO social wait

on:
  push:
    paths:
      - '.github/workflows/fix-social-wait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix recursive wait helper
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='frontend/social.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('async function waitForDbId(){for(let i=0;i<20;i++){const id=await waitForDbId();if(id)return id;await new Promise(r=>setTimeout(r,100))}return 0}', 'async function waitForDbId(){for(let i=0;i<20;i++){const id=resolveDbId();if(id)return id;await new Promise(r=>setTimeout(r,100))}return 0}');
          fs.writeFileSync(p,s);
          NODE
          node --check frontend/social.js
          grep -q 'async function waitForDbId(){for(let i=0;i<20;i++){const id=resolveDbId();' frontend/social.js
          ! grep -q 'async function waitForDbId(){for(let i=0;i<20;i++){const id=await waitForDbId();' frontend/social.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/social.js .github/workflows/fix-social-wait.yml
          git rm .github/workflows/fix-social-wait.yml
          git commit -m 'Fix social database ID wait loop'
          git push
