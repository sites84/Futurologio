name: Finalize catalog Builder import v2
on:
  workflow_run:
    workflows: [Build catalog master]
    types: [completed]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate catalog master
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          ids=[str(p.get('id')) for p in catalog if isinstance(p,dict) and p.get('id')]
          assert len(ids)==len(set(ids)), 'IDs duplicados no catalog.json'
          assert len(catalog) >= 229, f'Catálogo abaixo do mínimo esperado: {len(catalog)}'
          required=['produto-202','futurologio-004','futurologio-006','futurologio-007','futurologio-008','futurologio-009','futurologio-010']
          missing=[x for x in required if x not in ids]
          assert not missing, f'Novos produtos ausentes: {missing}'
          for i in range(156,202):
              assert f'produto-{i}' in ids, f'produto-{i} ausente'
          print(f'CATÁLOGO VALIDADO: {len(catalog)} produtos')
          print('NOVOS PRODUTOS PRESENTES:', ', '.join(required))
          PY
      - name: Recover generic descriptions
        run: python scripts/recover_generic_catalog.py
      - name: Commit recovery outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-generic-recovery-report.json backend/catalog_generic_repair.sql
          git diff --cached --quiet || git commit -m 'catalog-master: recover generic product descriptions [catalog-master]'
          git push || true
