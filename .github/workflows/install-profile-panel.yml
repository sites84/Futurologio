name: Install FUTUROLOGIO profile panel

on:
  push:
    paths:
      - 'frontend/profile-panel.js'
      - 'frontend/social.js'
      - '.github/workflows/install-profile-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install profile and remove local demo account
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="frontend/profile-panel.js"></script>'
          if tag not in s:
            s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          p=Path('frontend/social.js')
          s=p.read_text(encoding='utf-8')
          old="document.getElementById('ftDemoLogin').onclick=()=>{const name=document.getElementById('ftNameInput').value.trim()||'Inventor Curioso';const u={id:'local-'+Date.now(),username:name,xp:0,level:1,role:'Curioso Iniciante',creations:0,badges:[]};saveLocal(u);state.user=u;modal.classList.remove('open');renderUser()}"
          new="document.getElementById('ftDemoLogin').onclick=()=>{document.getElementById('ftAuthStatus').textContent='O cadastro local foi desativado. Use o cadastro oficial para criar sua conta.';document.getElementById('ftLoginBtn')?.click()}"
          if old in s:s=s.replace(old,new,1)
          s=s.replace('Criar perfil local','Criar conta')
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check frontend/profile-panel.js && node --check frontend/social.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html frontend/profile-panel.js frontend/social.js
          git diff --cached --quiet || git commit -m 'Install authenticated profile panel'
          git push
