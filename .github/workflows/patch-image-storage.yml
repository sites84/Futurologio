name: Add invention image storage
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker image routes and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/worker.js')
          s=p.read_text()
          marker='async fetch(request, env) {'
          if marker not in s:
              raise SystemExit('fetch marker not found')
          if "'/api/invention-image'" not in s:
              inject=r'''async fetch(request, env) {
    const imageUrl = new URL(request.url);
    if (request.method === 'POST' && imageUrl.pathname === '/api/invention-image') {
      const u = auth(request, env);
      if (!u) return json({ error: 'Sessão necessária.' }, 401);
      if (!env.IMAGES) return json({ error: 'Armazenamento de imagens indisponível.' }, 503);
      const form = await request.formData();
      const file = form.get('image');
      const inventionId = Number(form.get('invention_id'));
      if (!Number.isInteger(inventionId) || inventionId < 1 || !file || typeof file.arrayBuffer !== 'function') return json({ error: 'Imagem ou invenção inválida.' }, 400);
      if (!String(file.type || '').toLowerCase().startsWith('image/')) return json({ error: 'Envie uma imagem válida.' }, 400);
      if (file.size > 8 * 1024 * 1024) return json({ error: 'A imagem deve ter no máximo 8 MB.' }, 413);
      const owner = await env.DB.prepare(`SELECT i.id,i.image_key FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id WHERE i.id=? AND o.user_id=?`).bind(inventionId, u.sub).first();
      if (!owner) return json({ error: 'Você só pode enviar imagem para uma invenção sua.' }, 403);
      const ext = ({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[String(file.type).toLowerCase()]) || 'bin';
      const key = `inventions/${inventionId}/${crypto.randomUUID()}.${ext}`;
      await env.IMAGES.put(key, file, { httpMetadata: { contentType: file.type, cacheControl: 'public, max-age=31536000, immutable' } });
      if (owner.image_key) await env.IMAGES.delete(owner.image_key);
      await env.DB.prepare(`UPDATE INVENTIONS SET image_key=?, image_content_type=?, image_source='upload' WHERE id=?`).bind(key, file.type, inventionId).run();
      return json({ ok: true, invention_id: inventionId, image_url: `/api/invention-image/${inventionId}`, source: 'upload' });
    }
    if (request.method === 'GET' && imageUrl.pathname.startsWith('/api/invention-image/')) {
      if (!env.IMAGES) return new Response('Not configured', { status: 503 });
      const inventionId = Number(imageUrl.pathname.split('/').pop());
      if (!Number.isInteger(inventionId) || inventionId < 1) return new Response('Not found', { status: 404 });
      const row = await env.DB.prepare(`SELECT image_key,image_content_type FROM INVENTIONS WHERE id=?`).bind(inventionId).first();
      if (!row?.image_key) return new Response('Not found', { status: 404 });
      const object = await env.IMAGES.get(row.image_key);
      if (!object) return new Response('Not found', { status: 404 });
      const headers = new Headers();
      object.writeHttpMetadata(headers);
      headers.set('cache-control', 'public, max-age=31536000, immutable');
      return new Response(object.body, { headers });
    }
'''
              s=s.replace(marker,inject,1)
          p.write_text(s)

          p=Path('frontend/game-ui.js')
          s=p.read_text()
          s=s.replace('font-size:9px;color:#7f91af;margin-top:9px}.game-prompt-note b{color:#d8ff55}', 'font-size:9px;color:#7f91af;margin-top:9px}.game-prompt-note b{color:#d8ff55}.game-image-upload{margin-top:12px;border-top:1px solid #30415f;padding-top:12px}.game-image-upload label{display:block;color:#aebbd2;font-size:11px;font-weight:900;margin-bottom:7px}.game-image-upload input{width:100%;font-size:11px;color:#dce6ff}.game-upload-status{font-size:10px;color:#9eb1d0;margin-top:7px}.game-upload-status.ok{color:#d8ff55}.game-upload-status.err{color:#ff8da7}', 1)
          old="<div class=\"game-prompt-actions\"><button class=\"game-prompt-copy\">COPIAR PROMPT</button></div><div class=\"game-prompt-note\">"
          new="<div class=\"game-prompt-actions\"><button class=\"game-prompt-copy\">COPIAR PROMPT</button></div><div class=\"game-image-upload\"><label>Já criou a imagem em outro lugar? Envie aqui.</label><input class=\"game-image-file\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,image/gif\"><div class=\"game-upload-status\">JPG, PNG ou WebP · máximo 8 MB · imagem horizontal recomendada.</div></div><div class=\"game-prompt-note\">"
          if old in s and 'game-image-file' not in s:
              s=s.replace(old,new,1)
          anchor="function ensurePromptCard(){"
          helper=r'''async function uploadInventionImage(file){
    const p=currentProduct();
    const id=Number(window.FUTUROLOGIO_DB_ID_FOR?.(p?.id)||0);
    const status=document.querySelector('.game-upload-status');
    if(!id){if(status){status.className='game-upload-status err';status.textContent='Faça login e registre esta invenção antes de enviar a imagem.';}return}
    if(!file||file.size>8*1024*1024){if(status){status.className='game-upload-status err';status.textContent='A imagem deve ter no máximo 8 MB.';}return}
    if(status){status.className='game-upload-status';status.textContent='Enviando imagem…'}
    try{
      const token=localStorage.getItem('futuro_auth_token')||'';
      const fd=new FormData();fd.append('invention_id',String(id));fd.append('image',file,file.name||'invention-image');
      const r=await fetch('https://motor-invencoes.edsonfernandesvet.workers.dev/api/invention-image',{method:'POST',headers:token?{Authorization:'Bearer '+token}: {},body:fd});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||'Não foi possível enviar a imagem.');
      const p2=currentProduct();if(p2){p2.image_url='https://motor-invencoes.edsonfernandesvet.workers.dev/api/invention-image/'+id}
      refreshImageCard();
      if(status){status.className='game-upload-status ok';status.textContent='Imagem enviada e vinculada à sua invenção.'}
    }catch(e){if(status){status.className='game-upload-status err';status.textContent=e.message||'Falha no envio.'}}
  }
  '''
          if 'async function uploadInventionImage' not in s:
              s=s.replace(anchor,helper+anchor,1)
          hook="document.querySelectorAll('.game-style-btn').forEach(btn=>{"
          # Insert upload event after prompt card creation logic by using a stable end hook if available.
          if 'game-image-file' in s and "change',e=>uploadInventionImage" not in s:
              s=s.replace("document.querySelectorAll('.game-style-btn').forEach(btn=>{", "document.querySelector('.game-image-file')?.addEventListener('change',e=>uploadInventionImage(e.target.files?.[0]));\n    document.querySelectorAll('.game-style-btn').forEach(btn=>{",1)
          # Make the generated prompt explicitly carry the display format.
          s=s.replace('Formato horizontal 16:9, composição pronta para página web e compartilhamento social.`;', 'FORMATO OBRIGATÓRIO: 16:9 horizontal, 1024x576 px, composição centralizada com margem de segurança nas bordas para não cortar o produto, o nome do produto ou a assinatura. Priorizar enquadramento horizontal para a ficha do FUTUROLOGIO e compartilhamento social.`;', 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check backend/worker.js
          node --check frontend/game-ui.js
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/worker.js frontend/game-ui.js
          git commit -m 'Add invention image upload and format prompt'
          git rm .github/workflows/patch-image-storage.yml
          git commit -m 'Remove temporary image storage patch workflow'
          git push
