name: Fix social sharing flow

on:
  push:
    paths:
      - '.github/workflows/fix-social-share.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch social share behavior
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='frontend/social.js'; let s=fs.readFileSync(p,'utf8');
          const old="else if(platform==='instagram')target='https://www.instagram.com/';else if(platform==='threads')target='https://www.threads.net/intent/post?text='+encodeURIComponent(text+' '+url);else if(platform==='copy'){try{await navigator.clipboard.writeText(url);alert('Link copiado.')}catch{prompt('Copie o link:',url)}}else if(platform==='native'&&navigator.share){try{await navigator.share({title:name,text,url})}catch{}return}else target=url;if(target)window.open(target,'_blank','noopener,noreferrer');try{const d=await api(`/api/inventions/${id}/share`,{method:'POST',body:JSON.stringify({platform})});"
          const neu="else if(platform==='instagram'){try{await navigator.clipboard.writeText(text+' '+url);alert('Texto e link copiados. Cole no Instagram.')}catch{prompt('Copie o texto e link:',text+' '+url)}target='https://www.instagram.com/';}else if(platform==='threads')target='https://www.threads.net/intent/post?text='+encodeURIComponent(text+' '+url);else if(platform==='copy'){try{await navigator.clipboard.writeText(url);alert('Link copiado.')}catch{prompt('Copie o link:',url)}target='';}else if(platform==='native'&&navigator.share){try{await navigator.share({title:name,text,url})}catch{return}}else target=url;if(target)window.open(target,'_blank','noopener,noreferrer');try{const d=await api(`/api/inventions/${id}/share`,{method:'POST',body:JSON.stringify({platform})});"
          if(!s.includes(old))throw new Error('share target block not found');
          s=s.replace(old,neu);
          fs.writeFileSync(p,s);
          NODE
          node --check frontend/social.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/social.js
          git diff --cached --quiet || git commit -m 'Fix native and copy social sharing flow'
          git rm .github/workflows/fix-social-share.yml
          git commit -m 'Remove temporary social share fix workflow'
          git push
