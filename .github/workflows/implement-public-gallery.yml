name: Implement public gallery and AI image flow
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # XP for image uploads.
          p=Path('backend/roles.js'); s=p.read_text()
          s=s.replace("  share: 2\n});", "  share: 2,\n  upload: 5\n});")
          s=s.replace("  share: 10\n});", "  share: 10,\n  upload: 10\n});")
          p.write_text(s)

          # Public creator endpoint. Keep the existing private profile endpoint intact.
          p=Path('backend/worker.js'); s=p.read_text()
          marker="if(path==='/api/profile'&&request.method==='GET')"
          if "path.startsWith('/api/users/')" not in s:
              endpoint="""if(path.startsWith('/api/users/')&&request.method==='GET'){const creatorId=decodeURIComponent(path.split('/').pop()||'');if(!creatorId)return json({ok:false,error:'Criador não encontrado.'},404);const u=await env.DB.prepare('SELECT id,username,avatar,xp,level FROM USERS WHERE id=?').bind(creatorId).first();if(!u)return json({ok:false,error:'Criador não encontrado.'},404);const stats=await env.DB.prepare(\"SELECT (SELECT COUNT(*) FROM INVENTION_OWNERS WHERE user_id=?) creations,(SELECT COUNT(*) FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id WHERE o.user_id=? AND i.image_source='upload') uploads,(SELECT COUNT(*) FROM LIKES l JOIN INVENTION_OWNERS o ON o.invention_id=l.invention_id WHERE o.user_id=?) likesReceived\").bind(creatorId,creatorId,creatorId).first();const rows=await env.DB.prepare('SELECT i.id,i.name,i.category,i.concept,i.data,i.image_key,(SELECT COUNT(*) FROM LIKES l WHERE l.invention_id=i.id) likes FROM INVENTIONS i JOIN INVENTION_OWNERS o ON o.invention_id=i.id WHERE o.user_id=? ORDER BY o.created_at DESC LIMIT 24').bind(creatorId).all();return json({ok:true,user:{id:u.id,username:u.username,avatar:u.avatar,xp:Number(u.xp||0),level:Number(u.level||1),role:roleFromLevel(Number(u.level||1)),creations:Number(stats?.creations||0),uploads:Number(stats?.uploads||0),likesReceived:Number(stats?.likesReceived||0)},inventions:(rows.results||[]).map(r=>{let d={};try{d=JSON.parse(r.data||'{}')}catch{};return {...r,source_id:d.source_id||null,image_url:r.image_key?`${url.origin}/api/invention-image/${r.id}`:null}})})} """
              s=s.replace(marker,endpoint+marker,1)
              p.write_text(s)

          # Replace game UI with one official visual style and AI shortcuts.
          Path('frontend/game-ui.js').write_text(r'''(() => {
            'use strict';
            const API='https://motor-invencoes.edsonfernandesvet.workers.dev';
            const css=`
            :root{--g-bg:#080b16;--g-panel:#10172a;--g-panel2:#151e35;--g-ink:#f7f8ff;--g-muted:#9aa7c2;--g-lime:#d8ff55;--g-cyan:#62e6ff;--g-pink:#ff62c6;--g-gold:#ffd34e;--g-line:#2a3858}
            body.game-mode{background:radial-gradient(circle at 50% -10%,#26375d 0,#10172a 30%,#080b16 72%);color:var(--g-ink);min-height:100vh;background-attachment:fixed}
            body.game-mode:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(98,230,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(98,230,255,.08) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 85%);z-index:-1}
            .game-mode header{background:rgba(8,11,22,.88);border-bottom:2px solid var(--g-cyan);box-shadow:0 4px 22px rgba(98,230,255,.12);backdrop-filter:blur(12px)}
            .game-mode .logo{color:#fff;text-shadow:0 0 18px rgba(98,230,255,.45)}.game-mode .logo span{background:var(--g-pink);color:#160b19;border-color:#fff;box-shadow:3px 3px 0 #fff}
            .game-mode .hero h1,.game-mode .panel h2,.game-mode .result h2{color:#fff}.game-mode .hero p,.game-mode .panel>p{color:var(--g-muted)}
            .game-mode .panel{background:linear-gradient(145deg,var(--g-panel),var(--g-panel2));border:2px solid var(--g-line);border-radius:18px;box-shadow:0 14px 0 #050710,0 18px 35px rgba(0,0,0,.28);color:var(--g-ink);position:relative;overflow:hidden}.game-mode .panel:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--g-cyan),var(--g-pink),var(--g-lime))}
            .game-mode .cat{background:#0c1324;color:#dce5ff;border-color:var(--g-line);box-shadow:0 4px 0 #070b15}.game-mode .cat.selected{background:linear-gradient(135deg,var(--g-lime),#a7db39);color:#081006;border-color:#fff}
            .game-mode .create{background:linear-gradient(90deg,var(--g-pink),#ff8bdf 48%,var(--g-cyan));color:#090b15;border-color:#fff;box-shadow:0 7px 0 #080b16;text-transform:uppercase;letter-spacing:.06em}
            .game-mode .tag{background:var(--g-pink);border-color:#fff;color:#170914}.game-mode .intro{color:#e8ecf8}.game-mode .fact,.game-mode .card{background:#0b1222;border-color:var(--g-line);color:#edf2ff}.game-mode .fact small{color:var(--g-muted)}.game-mode .fact b{color:#fff}.game-mode .techItem{background:#111b30;border-color:#2a3858}.game-mode .techItem p{color:#aebbd2}.game-mode .primary{background:var(--g-lime);color:#091007;border-color:#fff}.game-mode .secondary{background:#101a2e;color:#fff;border-color:#4b5f86}.game-mode .stamp{border-color:#4b5f86;background:#0b1222;color:#c8d3e9}.game-mode .history span{background:#101a2e;color:#dce5ff;border-color:#30415f}.game-mode footer{color:#6f7e9d}
            .game-image-card{margin:0 0 18px;border:2px solid #30415f;border-radius:16px;background:linear-gradient(145deg,#080e1d,#141e35);padding:10px}.game-image-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#0b1120}.game-image-placeholder{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#24395c,#0b1120 68%);color:#9eb1d0;border:1px dashed #3b537a}.game-image-placeholder strong{display:block;color:var(--g-lime);font-size:15px;margin-bottom:6px}.game-image-meta{display:flex;justify-content:space-between;gap:10px;margin:9px 2px 0;color:#7f91af;font-size:10px;text-transform:uppercase;font-weight:900}.game-image-meta b{color:var(--g-cyan)}
            .game-prompt-card{margin:20px 0 0;border:2px solid #3b4f78;border-radius:18px;padding:18px;background:linear-gradient(145deg,#0a1222,#18233d);box-shadow:0 8px 0 #050710;color:#edf2ff}.game-prompt-kicker{display:inline-block;font-size:9px;font-weight:1000;letter-spacing:.15em;color:var(--g-cyan);border:1px solid #31526c;background:#07101c;border-radius:99px;padding:5px 8px}.game-prompt-card h3{margin:9px 0 5px;font-size:21px;color:#fff}.game-prompt-card>p{margin:0 0 14px;color:#aebbd2;font-size:12px;line-height:1.5}.game-prompt-text{width:100%;min-height:230px;resize:vertical;border:1px solid #405476;border-radius:12px;background:#070d19;color:#eaf1ff;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;box-sizing:border-box}.game-prompt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.game-prompt-copy{background:var(--g-cyan);color:#07101a;border:1px solid #fff;border-radius:10px;padding:10px 13px;font-weight:1000;cursor:pointer}.game-ai-title{margin:18px 0 8px;color:#fff;font-size:12px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.game-ai-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.game-ai-links a{display:flex;align-items:center;justify-content:center;min-height:42px;text-decoration:none;border:1px solid #405476;border-radius:10px;background:#0b1427;color:#fff;font-size:11px;font-weight:1000}.game-ai-links a:hover{border-color:var(--g-cyan);transform:translateY(-1px)}
            .game-image-upload{margin-top:16px;border-top:1px solid #30415f;padding-top:14px}.game-image-upload label{display:block;color:#fff;font-size:12px;font-weight:1000;margin-bottom:7px}.game-image-upload input{width:100%;font-size:11px;color:#dce6ff}.game-upload-status{font-size:10px;color:#9eb1d0;margin-top:7px;line-height:1.45}.game-upload-status.ok{color:var(--g-lime)}.game-upload-status.err{color:#ff8da7}.game-prompt-note{font-size:10px;color:#aebbd2;margin-top:10px;line-height:1.45}.game-prompt-note b{color:var(--g-lime)}
            .game-mode .ft-profile-card,.game-mode .ft-rp-card{color:#171717!important;background:#fff!important}.game-mode .ft-profile-card h2,.game-mode .ft-profile-card h3,.game-mode .ft-profile-card p,.game-mode .ft-profile-card span,.game-mode .ft-profile-card strong,.game-mode .ft-rp-card h2,.game-mode .ft-rp-card h3,.game-mode .ft-rp-card p,.game-mode .ft-rp-card span,.game-mode .ft-rp-card strong,.game-mode .ft-rp-card small{color:#171717!important}
            @media(max-width:760px){.game-ai-links{grid-template-columns:1fr}.game-mode .panel{box-shadow:0 9px 0 #050710,0 14px 28px rgba(0,0,0,.24)}}`;
            const style=document.createElement('style');style.id='futuro-game-ui';style.textContent=css;document.head.appendChild(style);document.body.classList.add('game-mode');
            function currentProduct(){const name=document.getElementById('name')?.textContent?.trim();if(!name||!Array.isArray(window.FUTUROLOGIO_PRODUCTS))return null;return window.FUTUROLOGIO_PRODUCTS.find(p=>p.name===name)||null}
            function dbId(p){return Number(window.FUTUROLOGIO_DB_ID_FOR?.(p?.id)||0)}
            function ensureImageCard(){const result=document.getElementById('result'),panel=result?.querySelector('.panel');if(!panel||panel.querySelector('.game-image-card'))return;const card=document.createElement('div');card.className='game-image-card';card.innerHTML='<div class="game-image-placeholder"><div><strong>VISUALIZAÇÃO DA INVENÇÃO</strong><span>Crie a imagem na IA de sua preferência usando o prompt abaixo e envie o arquivo aqui.</span></div></div><div class="game-image-meta"><span>IMAGEM DO CRIADOR</span><b>AGUARDANDO UPLOAD</b></div>';panel.querySelector('.tag')?.insertAdjacentElement('afterend',card)}
            function refreshImageCard(){ensureImageCard();const card=document.querySelector('.game-image-card'),p=currentProduct();if(!card||!p)return;const id=dbId(p),src=id?API+'/api/invention-image/'+id:null;if(src){const ph=card.querySelector('.game-image-placeholder');ph.innerHTML='<img alt="'+String(p.name).replace(/"/g,'&quot;')+'" src="'+src+'">';card.querySelector('.game-image-meta b').textContent='IMAGEM ENVIADA'}}
            function buildPrompt(p){if(!p)return '';const clean=v=>String(v||'').replace(/\s+/g,' ').trim();return `Crie uma imagem publicitária oficial de uma invenção fictícia do site FUTUROLOGIO™.\n\nPRODUTO: ${clean(p.name)}\nCATEGORIA: ${clean(p.category)}\nO QUE É: ${clean(p.what)}\nCOMO FUNCIONA: ${clean(p.build)}\nTECNOLOGIAS: ${clean(p.realTech)} ${clean(p.specTech)} ${clean(p.inventedTech)}\n\nESTILO OFICIAL FUTUROLOGIO: 3D TOY-TECH ABSURDO — este é o único estilo visual permitido para manter identidade consistente entre todas as invenções. Visual de produto 3D premium, aparência de brinquedo colecionável sofisticado, materiais plásticos e metálicos, iluminação de estúdio, cores neon controladas, formas exageradas e humor visual elegante.\n\nCENA: mostre o produto claramente EM FUNCIONAMENTO, sendo usado por uma pessoa em uma situação cotidiana coerente com sua função. A cena deve ser engraçada, absurda e fácil de entender, mas o produto continua sendo o protagonista. Mostrar consequências cômicas da invenção sem transformar a imagem em um meme genérico. Composição cinematográfica, enquadramento publicitário, alta qualidade, detalhes ricos e aparência de peça oficial do catálogo FUTUROLOGIO.\n\nIDENTIDADE VISUAL OBRIGATÓRIA: incluir de forma legível e integrada o nome “${clean(p.name)}” e a assinatura “INVENÇÕES FUTUROLOGIO™”. Não substituir, abreviar ou alterar esses textos. O nome pode aparecer em uma placa, embalagem, tela ou elemento gráfico da publicidade. A assinatura deve aparecer como marca do catálogo.\n\nREGRAS: não usar logotipos de marcas reais, não copiar personagens existentes, não esconder o produto e não criar uma imagem genérica.\n\nFORMATO OBRIGATÓRIO: 16:9 horizontal, 1024x576 px, composição centralizada com margem de segurança para não cortar produto, nome ou assinatura. Priorizar enquadramento horizontal para a ficha do FUTUROLOGIO e compartilhamento social.`}
            async function upload(file){const p=currentProduct(),id=dbId(p),status=document.querySelector('.game-upload-status');if(!id){if(status)status.textContent='Faça login e registre esta invenção antes de enviar a imagem.';return}if(!file||file.size>8*1024*1024){if(status)status.textContent='A imagem deve ter no máximo 8 MB.';return}if(status){status.className='game-upload-status';status.textContent='Enviando imagem…'}try{const t=localStorage.getItem('futuro_auth_token')||'',fd=new FormData();fd.append('invention_id',String(id));fd.append('image',file,file.name||'invention-image');const r=await fetch(API+'/api/invention-image',{method:'POST',headers:t?{Authorization:'Bearer '+t}:{},body:fd}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível enviar a imagem.');refreshImageCard();if(status){status.className='game-upload-status ok';status.textContent='Imagem enviada. Você ganhou '+(Number(d.xp)||0)+' XP.'}}catch(e){if(status){status.className='game-upload-status err';status.textContent=e.message||'Falha no envio.'}}}
            function ensurePromptCard(){const result=document.getElementById('result'),panel=result?.querySelector('.panel'),stamp=panel?.querySelector('.stamp');if(!panel||!stamp||panel.querySelector('.game-prompt-card'))return;const card=document.createElement('section');card.className='game-prompt-card';card.innerHTML='<span class="game-prompt-kicker">IA // DIREÇÃO DE ARTE</span><h3>Gere a imagem do seu produto</h3><p>O FUTUROLOGIO cria automaticamente este prompt. Use-o na IA que preferir, gere a imagem no estilo oficial e depois envie o arquivo aqui. <b>Ao criar a invenção e fazer o upload da foto, você ganha XP.</b></p><textarea class="game-prompt-text" readonly aria-label="Prompt para gerar a imagem"></textarea><div class="game-prompt-actions"><button class="game-prompt-copy">COPIAR PROMPT</button></div><div class="game-ai-title">IAS INDICADAS PARA CRIAÇÃO</div><div class="game-ai-links"><a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer">CHATGPT</a><a href="https://grok.com" target="_blank" rel="noopener noreferrer">GROK</a><a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer">GEMINI</a></div><div class="game-image-upload"><label>Já criou a imagem? Faça o upload e ganhe XP.</label><input class="game-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="game-upload-status">JPG, PNG, WebP ou GIF · máximo 8 MB · recomendado: 1024×576, horizontal 16:9.</div></div><div class="game-prompt-note"><b>Estilo único do site:</b> 3D Toy-Tech Absurdo. <b>Regra:</b> não retire a marca INVENÇÕES FUTUROLOGIO™. Uso incorreto do prompt ou retirada da marca pode causar exclusão da imagem.</div>';stamp.insertAdjacentElement('afterend',card);card.querySelector('.game-prompt-copy').onclick=async()=>{const text=card.querySelector('.game-prompt-text').value;try{await navigator.clipboard.writeText(text);alert('Prompt copiado.')}catch{prompt('Copie o prompt:',text)}};card.querySelector('.game-image-file').addEventListener('change',e=>upload(e.target.files?.[0]))}
            function refresh(){ensureImageCard();ensurePromptCard();const card=document.querySelector('.game-prompt-card'),p=currentProduct();if(card&&p)card.querySelector('.game-prompt-text').value=buildPrompt(p);refreshImageCard()}
            const name=document.getElementById('name');if(name)new MutationObserver(refresh).observe(name,{childList:true,characterData:true,subtree:true});document.addEventListener('DOMContentLoaded',refresh);setTimeout(refresh,500);
          })();
          ''')

          # Replace profile panel with accessible own creations + public discovery.
          Path('frontend/profile-panel.js').write_text(r'''(() => {
            'use strict';
            const API='https://motor-invencoes.edsonfernandesvet.workers.dev',TOKEN='futuro_auth_token',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            const style=document.createElement('style');style.textContent=`
            .ft-real-profile,.ft-discovery{max-width:1120px;margin:18px auto;padding:0 20px}.ft-rp-card,.ft-discovery-card{background:#fff;color:#171717;border:2px solid #171717;border-radius:18px;padding:18px;box-shadow:6px 6px 0 #171717}.ft-rp-card h2,.ft-rp-card h3,.ft-rp-card p,.ft-rp-card span,.ft-rp-card b,.ft-rp-card small{color:#171717}.ft-rp-head{display:flex;gap:12px;align-items:center}.ft-rp-avatar{width:58px;height:58px;border:2px solid #171717;border-radius:50%;display:grid;place-items:center;background:#d8ff55;font-weight:950;font-size:20px;color:#171717}.ft-rp-head h2{margin:0 0 2px}.ft-rp-head b,.ft-rp-head small{display:block}.ft-rp-head small{color:#6f6b63!important;margin-top:3px}.ft-rp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:15px}.ft-rp-grid div{border:1px solid #171717;border-radius:10px;padding:8px;text-align:center;background:#fff;color:#171717}.ft-rp-grid b,.ft-rp-grid small{display:block;color:#171717}.ft-rp-grid small{font-size:9px;color:#6f6b63!important}.ft-rp-medal{margin-top:12px;font-weight:900;color:#171717}.ft-rp-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.ft-rp-badges span{border:1px solid #171717;border-radius:99px;padding:4px 7px;background:#fff;color:#171717;font-size:10px}.ft-section-title{margin:18px 0 10px;color:#fff;font-size:18px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em}.ft-discovery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ft-discovery-card{padding:0;overflow:hidden;cursor:pointer;transition:transform .15s}.ft-discovery-card:hover{transform:translateY(-3px)}.ft-discovery-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#10172a;display:block}.ft-discovery-noimg{width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#10172a,#24395c);color:#d8ff55;font-weight:1000}.ft-discovery-body{padding:12px}.ft-discovery-body h3{margin:0 0 4px;font-size:15px}.ft-discovery-body p{margin:0 0 7px;font-size:11px;color:#555!important}.ft-discovery-meta{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:900}.ft-creator-link{border:0;background:none;padding:0;color:#155f7a!important;font-weight:1000;cursor:pointer}.ft-discovery-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ft-disc-tab{border:1px solid #62e6ff;border-radius:10px;background:#10172a;color:#fff;padding:8px 11px;font-weight:900;cursor:pointer}.ft-disc-tab.active{background:#d8ff55;color:#091007}.ft-modal{position:fixed;inset:0;background:rgba(3,6,15,.78);display:grid;place-items:center;padding:18px;z-index:9999}.ft-modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;color:#171717;border:2px solid #171717;border-radius:18px;box-shadow:10px 10px 0 #000;padding:18px}.ft-modal-card h2,.ft-modal-card h3,.ft-modal-card p,.ft-modal-card span,.ft-modal-card b{color:#171717}.ft-modal-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#10172a}.ft-modal-close{float:right;border:0;background:#171717;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.ft-modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ft-modal-actions button{border:1px solid #171717;border-radius:9px;padding:9px 12px;background:#d8ff55;color:#171717;font-weight:1000;cursor:pointer}.ft-my-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.ft-my-item{border:1px solid #171717;border-radius:10px;padding:9px;background:#fff;color:#171717;cursor:pointer}.ft-my-item b{display:block;color:#171717}.ft-my-item small{color:#666}.ft-rp-visitor,.ft-rp-loading{border:1.5px dashed #171717;border-radius:14px;padding:15px;background:#fff;color:#171717}.ft-rp-visitor b,.ft-rp-visitor span{display:block;color:#171717}.ft-rp-visitor span{font-size:12px;color:#6f6b63!important;margin-top:4px}@media(max-width:760px){.ft-real-profile,.ft-discovery{padding:0 12px}.ft-rp-grid{grid-template-columns:repeat(3,1fr)}.ft-discovery-grid{grid-template-columns:1fr}.ft-my-grid{grid-template-columns:repeat(2,1fr)}}`;
            document.head.appendChild(style);
            async function get(path,auth=false){const h={};const t=localStorage.getItem(TOKEN)||'';if(auth&&t)h.Authorization='Bearer '+t;const r=await fetch(API+path,{headers:h});if(!r.ok)throw Error('request');return r.json()}
            function modal(html){const old=$('ftPublicModal');if(old)old.remove();const x=document.createElement('div');x.id='ftPublicModal';x.className='ft-modal';x.innerHTML='<div class="ft-modal-card">'+html+'</div>';document.body.appendChild(x);x.onclick=e=>{if(e.target===x)x.remove()};x.querySelector('.ft-modal-close')?.addEventListener('click',()=>x.remove())}
            async function showInvention(id){try{const d=await get('/api/invention/'+id);const i=d.data||{};modal('<button class="ft-modal-close">FECHAR</button>'+(d.image_url?'<img class="ft-modal-img" src="'+esc(d.image_url)+'">':'')+'<h2>'+esc(d.name)+'</h2><p><b>'+esc(d.category)+'</b></p><p>'+esc(d.concept)+'</p><p>❤️ '+d.likes+' curtidas · 💬 '+d.comments+' comentários</p><div class="ft-modal-actions"><button class="ft-creator-link" data-creator="'+esc(d.user.id)+'">Ver perfil de @'+esc(d.user.username)+'</button></div>');document.querySelector('#ftPublicModal [data-creator]')?.addEventListener('click',()=>showCreator(d.user.id))}catch{modal('<button class="ft-modal-close">FECHAR</button><p>Não foi possível carregar esta invenção.</p>')}}
            async function showCreator(id){try{const d=await get('/api/users/'+encodeURIComponent(id));const inv=(d.inventions||[]).slice(0,8).map(i=>'<div class="ft-my-item" data-inv="'+i.id+'"><b>'+esc(i.name)+'</b><small>'+esc(i.category)+' · ❤️ '+i.likes+'</small></div>').join('')||'<p>Este criador ainda não possui invenções públicas.</p>';modal('<button class="ft-modal-close">FECHAR</button><h2>@'+esc(d.user.username)+'</h2><p>Nível '+d.user.level+' · '+esc(d.user.role)+' · '+d.user.creations+' criações · '+d.user.uploads+' imagens</p><h3>Invenções do criador</h3><div class="ft-my-grid">'+inv+'</div>');document.querySelectorAll('#ftPublicModal [data-inv]').forEach(b=>b.onclick=()=>showInvention(b.dataset.inv))}catch{modal('<button class="ft-modal-close">FECHAR</button><p>Perfil não encontrado.</p>')}}
            function card(i){return '<article class="ft-discovery-card" data-inv="'+i.id+'">'+(i.image_url?'<img class="ft-discovery-img" src="'+esc(i.image_url)+'" alt="'+esc(i.name)+'">':'<div class="ft-discovery-noimg">FUTUROLOGIO</div>')+'<div class="ft-discovery-body"><h3>'+esc(i.name)+'</h3><p>'+esc(i.category)+'</p><div class="ft-discovery-meta"><span>❤️ '+i.likes+'</span><button class="ft-creator-link" data-creator="'+esc(i.user_id)+'">@'+esc(i.username)+'</button></div></div></article>'}
            async function loadDiscovery(){const root=document.createElement('section');root.className='ft-discovery';root.innerHTML='<div class="ft-section-title">EXPLORAR INVENÇÕES</div><div class="ft-discovery-tabs"><button class="ft-disc-tab active" data-mode="recent">Últimos produtos inventados</button><button class="ft-disc-tab" data-mode="week">Mais curtidos da semana</button></div><div class="ft-discovery-grid"><p>Carregando…</p></div>';document.querySelector('main')?.appendChild(root);const grid=root.querySelector('.ft-discovery-grid');async function load(mode){grid.innerHTML='<p>Carregando…</p>';try{const d=await get('/api/explore?mode='+mode+'&limit=12');grid.innerHTML=(d.items||[]).map(card).join('')||'<p>Nenhuma invenção disponível ainda.</p>';grid.querySelectorAll('[data-inv]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-creator]'))return;showInvention(x.dataset.inv)});grid.querySelectorAll('[data-creator]').forEach(x=>x.onclick=e=>{e.stopPropagation();showCreator(x.dataset.creator)})}catch{grid.innerHTML='<p>Não foi possível carregar as invenções agora.</p>'}}root.querySelectorAll('.ft-disc-tab').forEach(b=>b.onclick=()=>{root.querySelectorAll('.ft-disc-tab').forEach(x=>x.classList.toggle('active',x===b));load(b.dataset.mode)});load('recent')}
            async function loadProfile(){const t=localStorage.getItem(TOKEN)||'';if(!t)return null;try{return (await get('/api/profile',true)).profile||null}catch{return null}}
            async function loadMy(){const t=localStorage.getItem(TOKEN)||'';if(!t)return '';try{const d=await get('/api/my-inventions?limit=24',true);return '<h3>Minhas invenções</h3><div class="ft-my-grid">'+(d.items||[]).map(i=>'<div class="ft-my-item" data-inv="'+i.id+'"><b>'+esc(i.name)+'</b><small>'+esc(i.category)+' · ❤️ '+i.likes+(i.image_url?' · imagem':'')+'</small></div>').join('')+'</div>'}catch{return ''}}
            async function mount(){const box=document.createElement('section');box.id='ftRealProfile';box.className='ft-real-profile';box.innerHTML='<div class="ft-rp-loading">Carregando perfil…</div>';document.querySelector('main')?.appendChild(box);const p=await loadProfile();if(!p){box.innerHTML='<div class="ft-rp-visitor"><b>Seu perfil começa aqui.</b><span>Cadastre-se para registrar invenções, ganhar XP e evoluir de cargo.</span></div>'}else{box.innerHTML='<div class="ft-rp-card"><div class="ft-rp-head"><div class="ft-rp-avatar">'+esc((p.username||'C').slice(0,2).toUpperCase())+'</div><div><h2>'+esc(p.username)+'</h2><b>'+esc(p.role||'Curioso Iniciante')+'</b><small>Nível '+p.level+' · '+p.xp+' XP</small></div></div><div class="ft-rp-grid"><div><b>'+p.creations+'</b><small>criações</small></div><div><b>'+p.uploads+'</b><small>fotos</small></div><div><b>'+p.categories+'</b><small>categorias</small></div><div><b>'+p.likes+'</b><small>curtidas</small></div><div><b>'+p.comments+'</b><small>comentários</small></div><div><b>'+p.shares+'</b><small>compartilhamentos</small></div></div><div class="ft-rp-medal">Medalhas: '+((p.badges||[]).map(b=>esc(b.name)).join(' · ')||'nenhuma ainda')+'</div>'+await loadMy()+'</div>'}box.querySelectorAll('[data-inv]').forEach(x=>x.onclick=()=>showInvention(x.dataset.inv));loadDiscovery()}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
          })();
          ''')

          # Cache bust the two frontend files without changing other HTML.
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'frontend/game-ui\.js(?:\?v=[^"\']+)?', 'frontend/game-ui.js?v=20260908d', s, count=1)
          s=re.sub(r'frontend/profile-panel\.js(?:\?v=[^"\']+)?', 'frontend/profile-panel.js?v=20260908d', s, count=1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check backend/worker.js
          node --check backend/roles.js
          node --check frontend/game-ui.js
          node --check frontend/profile-panel.js
      - name: Commit changes and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/worker.js backend/roles.js frontend/game-ui.js frontend/profile-panel.js index.html
          git rm .github/workflows/implement-public-gallery.yml
          git commit -m 'Add public invention gallery and image AI shortcuts'
          git push
