name: Harden FUTUROLOGIO XP and progression

on:
  push:
    branches: [main]
    paths:
      - 'backend/worker.js'
      - 'backend/roles.js'
      - 'frontend/gamification.js'
      - 'index.html'
      - '.github/workflows/harden-xp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair backend progression and XP
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import { PLAN_LIMITS, XP_RULES, DAILY_XP_LIMITS, levelFromXp, roleFromLevel } from './roles.js';", "import { PLAN_LIMITS, XP_RULES, DAILY_XP_LIMITS, levelFromXp, roleFromLevel, medalLevels } from './roles.js';", 1)
          old="function roleData(xp){const level=levelFromXp(xp);return {xp,level,role:roleFromLevel(level),medal:level>=5&&level%5===0}}"
          new="function roleData(xp){const level=levelFromXp(xp);return {xp,level,role:roleFromLevel(level),medal:level>=5&&level%5===0,medals:medalLevels(level)}}"
          if old in s: s=s.replace(old,new,1)
          xp_old="async function xp(db,u,type,refType,refId){const lim=DAILY_XP_LIMITS[type];if(lim){const n=await db.prepare('SELECT COUNT(*) n FROM XP_EVENTS WHERE user_id=? AND event_type=? AND event_date=?').bind(u.id,type,today()).first();if(Number(n?.n||0)>=lim)return {granted:0,limited:true}}const amount=Number(XP_RULES[type]||0);if(!amount)return {granted:0,limited:false};await db.prepare('INSERT INTO XP_EVENTS(user_id,event_type,reference_type,reference_id,xp,event_date) VALUES(?,?,?,?,?,?)').bind(u.id,type,refType||null,refId?String(refId):null,amount,today()).run();await db.prepare('UPDATE USERS SET xp=xp+?,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(amount,u.id).run();const v=await user(db,u.id);return {granted:amount,limited:false,user:roleData(v.xp)}}"
          xp_new="async function xp(db,u,type,refType,refId){const lim=DAILY_XP_LIMITS[type];if(lim){const n=await db.prepare('SELECT COUNT(*) n FROM XP_EVENTS WHERE user_id=? AND event_type=? AND event_date=?').bind(u.id,type,today()).first();if(Number(n?.n||0)>=lim)return {granted:0,limited:true}}if((type==='like'||type==='share')&&refType&&refId){const prior=await db.prepare('SELECT 1 FROM XP_EVENTS WHERE user_id=? AND event_type=? AND reference_type=? AND reference_id=? LIMIT 1').bind(u.id,type,refType,String(refId)).first();if(prior)return {granted:0,limited:true}}const amount=Number(XP_RULES[type]||0);if(!amount)return {granted:0,limited:false};await db.prepare('INSERT INTO XP_EVENTS(user_id,event_type,reference_type,reference_id,xp,event_date) VALUES(?,?,?,?,?,?)').bind(u.id,type,refType||null,refId?String(refId):null,amount,today()).run();await db.prepare('UPDATE USERS SET xp=xp+?,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(amount,u.id).run();const v=await user(db,u.id);return {granted:amount,limited:false,user:roleData(v.xp)}}"
          if xp_old in s: s=s.replace(xp_old,xp_new,1)
          if 'async function awardBadges' not in s:
              marker="function b64(x){return btoa(String.fromCharCode(...new Uint8Array(x)))}"
              fn="""async function awardBadges(db,userId){
          const q=async sql=>Number((await db.prepare(sql).bind(userId).first())?.n||0);
          const stats={creations:await q('SELECT COUNT(*) n FROM USER_INVENTIONS WHERE user_id=?'),likes:await q('SELECT COUNT(*) n FROM LIKES WHERE user_id=?'),comments:await q('SELECT COUNT(*) n FROM COMMENTS WHERE user_id=?'),shares:await q('SELECT COUNT(*) n FROM SHARES WHERE user_id=?'),likesReceived:await q('SELECT COUNT(*) n FROM LIKES l JOIN USER_INVENTIONS ui ON ui.invention_id=l.invention_id WHERE ui.user_id=?'),categories:await q('SELECT COUNT(DISTINCT i.category) n FROM USER_INVENTIONS ui JOIN INVENTIONS i ON i.id=ui.invention_id WHERE ui.user_id=?'),bizarro:await q(\"SELECT COUNT(*) n FROM USER_INVENTIONS ui JOIN INVENTIONS i ON i.id=ui.invention_id WHERE ui.user_id=? AND i.category='Bizarro ou Nojento'\")};
          const ok={FIRST_CREATION:stats.creations>=1,TEN_CREATIONS:stats.creations>=10,FIFTY_CREATIONS:stats.creations>=50,FIRST_LIKE:stats.likes>=1,HUNDRED_LIKES_RECEIVED:stats.likesReceived>=100,FIRST_COMMENT:stats.comments>=1,FIFTY_COMMENTS:stats.comments>=50,FIRST_SHARE:stats.shares>=1,FIFTY_SHARES:stats.shares>=50,CATEGORY_EXPLORER:stats.categories>=10,MULTICATEGORY_CREATOR:stats.categories>=20,BIZARRO_EXPLORER:stats.bizarro>=1};
          const rows=await db.prepare('SELECT id,code FROM BADGES').all();
          for(const b of rows.results||[]){if(ok[b.code])await db.prepare('INSERT OR IGNORE INTO USER_BADGES(user_id,badge_id) VALUES(?,?)').bind(userId,b.id).run()}
        }
        """
              if marker not in s: raise SystemExit('badge insertion marker not found')
              s=s.replace(marker,fn+marker,1)
          if 'try{await awardBadges(db,u.id)}catch{}' not in s:
              needle="const v=await user(db,u.id);return {granted:amount,limited:false,user:roleData(v.xp)}}"
              repl="const v=await user(db,u.id);try{await awardBadges(db,u.id)}catch{}return {granted:amount,limited:false,user:roleData(v.xp)}}"
              if needle not in s: raise SystemExit('XP return marker not found')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
      - name: Repair frontend modules
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for tag in ['<script src="frontend/auth-gate.js"></script>','<script src="frontend/social-actions.js"></script>','<script src="frontend/gamification.js"></script>']:
              s=s.replace(tag,'')
          tags='\n<script src="frontend/auth-gate.js"></script>\n<script src="frontend/social-actions.js"></script>\n<script src="frontend/gamification.js"></script>\n'
          if '</body>' not in s: raise SystemExit('index.html has no closing body tag')
          s=s.replace('</body>',tags+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check backend/worker.js
          node --check backend/roles.js
          test -f frontend/auth-gate.js
          test -f frontend/social-actions.js
          test -f frontend/gamification.js
          grep -q 'frontend/auth-gate.js' index.html
          grep -q 'frontend/social-actions.js' index.html
          grep -q 'frontend/gamification.js' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add backend/worker.js index.html .github/workflows/harden-xp.yml
          git diff --cached --quiet || git commit -m 'Repair XP medals badges and frontend modules'
          git push
