name: Fix received likes badge

on:
  push:
    paths:
      - '.github/workflows/fix-badge-received.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='backend/worker.js';
          let s=fs.readFileSync(p,'utf8');
          const oldOk="FIRST_LIKE:stats.likes>=1,HUNDRED_LIKES_RECEIVED:stats.likesReceived>=100,FIRST_COMMENT";
          if(!s.includes(oldOk))throw new Error('badge rule target not found');
          s=s.replace(oldOk,"FIRST_LIKE:stats.likes>=1,FIRST_COMMENT");
          const marker="async function xp(db,u,type,refType,refId){";
          if(!s.includes(marker))throw new Error('xp marker not found');
          const helper="async function awardLikesReceivedBadge(db,inventionId){const owners=await db.prepare('SELECT DISTINCT user_id FROM USER_INVENTIONS WHERE invention_id=?').bind(inventionId).all();if(!owners.results?.length)return;const n=Number((await db.prepare('SELECT COUNT(*) n FROM LIKES WHERE invention_id=?').bind(inventionId).first())?.n||0);if(n<100)return;const b=await db.prepare(\"SELECT id FROM BADGES WHERE code='HUNDRED_LIKES_RECEIVED' LIMIT 1\").first();if(!b?.id)return;for(const o of owners.results)await db.prepare('INSERT OR IGNORE INTO USER_BADGES(user_id,badge_id) VALUES(?,?)').bind(o.user_id,b.id).run()}";
          if(!s.includes('async function awardLikesReceivedBadge'))s=s.replace(marker,helper+'\n'+marker);
          const oldLike="await env.DB.prepare('INSERT INTO LIKES(user_id,invention_id) VALUES(?,?)').bind(u.id,iid).run();return json({ok:true,liked:true,xp:await xp(env.DB,u,'like','invention',iid)})";
          if(!s.includes(oldLike))throw new Error('like insert target not found');
          const newLike="await env.DB.prepare('INSERT INTO LIKES(user_id,invention_id) VALUES(?,?)').bind(u.id,iid).run();await awardLikesReceivedBadge(env.DB,iid);return json({ok:true,liked:true,xp:await xp(env.DB,u,'like','invention',iid)})";
          s=s.replace(oldLike,newLike);
          fs.writeFileSync(p,s);
          NODE
          node --check backend/worker.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/worker.js
          git diff --cached --quiet || git commit -m 'Fix received likes badge ownership'
          git rm .github/workflows/fix-badge-received.yml
          git commit -m 'Remove temporary badge fix workflow'
          git push
