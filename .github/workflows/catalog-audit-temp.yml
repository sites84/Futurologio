name: Catalog audit
on:
  push:
    paths:
      - 'catalog-*.json'
      - 'catalog-*.b64'
      - 'frontend/catalog-*.b64'
      - '.github/workflows/catalog-audit-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Audit catalog
        run: |
          python3 - <<'PY'
          import json,base64,re,glob,gzip,os
          req=['name','what','realTech','specTech','inventedTech','build','uses','dangers','curiosity','tests','category']
          items=[]
          def add(obj,src):
              if isinstance(obj,list):
                  for x in obj:
                      if isinstance(x,dict) and x.get('id'): items.append((x,src))
              elif isinstance(obj,dict):
                  if obj.get('id'): items.append((obj,src))
                  elif isinstance(obj.get('content'),list): add(obj['content'],src)
          def decode_blob(raw):
              raw=base64.b64decode(raw,validate=False)
              if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
              return raw
          # JSON catalog files
          for f in sorted(glob.glob('catalog-*.json')):
              try:
                  txt=open(f,'rb').read().decode('utf-8','ignore').strip()
                  if txt!='PLACEHOLDER_WILL_FAIL': add(json.loads(txt),f)
              except Exception: pass
          # Individual extra gzip/base64 files
          for f in sorted(glob.glob('catalog-lote3.b64')+glob.glob('catalog-lote18.b64')+glob.glob('catalog-lote19.b64')+glob.glob('frontend/catalog-lote3.b64')+glob.glob('frontend/catalog-lote18.b64')+glob.glob('frontend/catalog-lote19.b64')):
              try: add(json.loads(decode_blob(open(f,'rb').read()).decode('utf-8','ignore')),f)
              except Exception: pass
          # Vol 1 is one gzip stream split across six base64 chunks.
          for root in ['','frontend/']:
              fs=[f'{root}catalog-vol1-{i:02d}.b64' for i in range(1,7)]
              if all(os.path.exists(f) for f in fs):
                  try: add(json.loads(decode_blob(b''.join(open(f,'rb').read().strip() for f in fs)).decode('utf-8','ignore')),root+'catalog-vol1-01..06.b64')
                  except Exception: pass
          # Lote 2 is one gzip stream per part/file, with 01 split into 01a+01b.
          for root in ['','frontend/']:
              groups=[[f'{root}catalog-lote2-01a.b64',f'{root}catalog-lote2-01b.b64']]+[[f'{root}catalog-lote2-{i:02d}.b64'] for i in range(2,20)]
              for fs in groups:
                  if all(os.path.exists(f) for f in fs):
                      try: add(json.loads(decode_blob(b''.join(open(f,'rb').read().strip() for f in fs)).decode('utf-8','ignore')),fs[0]+'+'+fs[-1])
                      except Exception: pass
          def num(x):
              m=re.search(r'-(\d+)$',x.get('id',''))
              return int(m.group(1)) if m else None
          def norm(s): return re.sub(r'[^a-z0-9]+','',str(s or '').lower())
          print('RAW_RECORDS',len(items))
          print('UNIQUE_IDS',len({x.get('id') for x,_ in items}))
          post=[(x,s) for x,s in items if (num(x) or 0)>139]
          print('POST_139',len(post))
          bad=[]
          for x,s in post:
              missing=[k for k in req if not str(x.get(k,'')).strip()]
              generic=('dispositivo físico revolucionário focado na categoria' in x.get('what','').lower() or x.get('inventedTech','').strip()=='O Cristal de Modulação Comportamental do FUTUROLOGIO™ — capaz de absorver impulsos de vergonha alheia ou desespero biológico.' or x.get('build','').strip().startswith('Uma carcaça ergonômica de polímero aeroespacial que se prende ao corpo'))
              if missing or generic: bad.append((x,s,missing,'TEMPLATE_GENERIC' if generic else 'MISSING_FIELD'))
          print('INVALID_DESCRIPTION',len(bad))
          for x,s,missing,reason in bad: print('BAD',x['id'],x.get('name'),reason,','.join(missing),s)
          byname={}; bywhat={}; dup=[]
          for x,s in items:
              n=num(x) or 999999
              for key,d,label in [(norm(x.get('name')),byname,'NAME'),(norm(x.get('what')),bywhat,'WHAT')]:
                  if not key: continue
                  if key in d:
                      y,ys=d[key]
                      if n>139 and x.get('id')!=y.get('id'): dup.append((x,s,y,ys,label))
                      elif n<=(num(y) or 999999) and (num(y) or 0)>139: dup.append((y,ys,x,s,label))
                  else: d[key]=(x,s)
          seen=set(); out=[]
          for x,s,y,ys,r in dup:
              if x['id'] not in seen: seen.add(x['id']); out.append((x,s,y,ys,r))
          print('DUPLICATES',len(out))
          for x,s,y,ys,r in out: print('DUP',x['id'],x.get('name'),'=',y['id'],y.get('name'),r,s,'vs',ys)
          PY
