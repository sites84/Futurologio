name: Install FUTUROLOGIO account gate

on:
  push:
    paths:
      - 'frontend/auth-gate.js'
      - '.github/workflows/install-auth-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect local catalog to authenticated profile
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="frontend/auth-gate.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
          old="function newInvention(){const pool=window.FUTUROLOGIO_PRODUCTS.filter(p=>p.category===selected&&!used.includes(p.id));if(!pool.length){alert('Essa categoria já mostrou todos os produtos disponíveis. Escolha outra categoria.');return}show(pool[Math.floor(Math.random()*pool.length)])}"
          new="function newInvention(){const pool=window.FUTUROLOGIO_PRODUCTS.filter(p=>p.category===selected&&!used.includes(p.id));if(!pool.length){alert('Essa categoria já mostrou todos os produtos disponíveis. Escolha outra categoria.');return}const p=pool[Math.floor(Math.random()*pool.length)];show(p);if(typeof window.FUTUROLOGIO_AFTER_CREATE==='function')window.FUTUROLOGIO_AFTER_CREATE(p)}"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          a=Path('frontend/auth-gate.js')
          s=a.read_text(encoding='utf-8')
          marker="  window.FUTUROLOGIO_AFTER_CREATE=recordCreated;"
          if marker not in s:
              raise SystemExit('auth callback missing')
          a.write_text(s,encoding='utf-8')
          w=Path('backend/worker.js')
          s=w.read_text(encoding='utf-8')
          if "/api/record-creation" not in s:
              marker="    if(path==='/api/inventions' && request.method==='GET'){"
              endpoint="""    if(path==='/api/record-creation' && request.method==='POST'){
      if(!session)return json({ok:false,error:'Não autenticado'},401);
      const u=await refreshUser(env.DB,session.sub); if(!u)return json({ok:false,error:'Usuário não encontrado'},404);
      const b=await body(request); const pid=String(b.id||'').trim(); const name=String(b.name||'').trim(); const category=String(b.category||'').trim();
      if(!pid||!name||!CATEGORIES.includes(category))return json({ok:false,error:'Invenção inválida para registro.'},400);
      const concept=String(b.what||'').trim()||name;
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((name+'|'+category+'|'+concept).toLowerCase().replace(/\\s+/g,' ').trim()));
      const fp=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('');
      let invention=await env.DB.prepare('SELECT * FROM INVENTIONS WHERE fingerprint=?').bind(fp).first();
      if(!invention){
        const slug=(name.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||'produto')+'-'+Date.now();
        const data=JSON.stringify({source_id:pid,what:b.what||'',realTech:b.realTech||'',specTech:b.specTech||'',inventedTech:b.inventedTech||'',build:b.build||'',uses:b.uses||'',dangers:b.dangers||'',test:b.test||'',curiosity:b.curiosity||'',readiness:b.readiness||'',year:b.year||'',patent:b.patent||''});
        await env.DB.prepare('INSERT INTO INVENTIONS(slug,name,category,concept,fingerprint,data) VALUES(?,?,?,?,?,?)').bind(slug,name,category,concept,fp,data).run();
        invention=await env.DB.prepare('SELECT * FROM INVENTIONS WHERE fingerprint=?').bind(fp).first();
      }
      const already=await env.DB.prepare('SELECT 1 FROM USER_INVENTIONS WHERE user_id=? AND invention_id=?').bind(u.id,invention.id).first();
      let xp={granted:0,limited:false};
      if(!already){ await env.DB.prepare('INSERT INTO USER_INVENTIONS(user_id,invention_id) VALUES(?,?)').bind(u.id,invention.id).run(); xp=await grantXp(env.DB,u,'creation','invention',invention.id); }
      const updated=await refreshUser(env.DB,u.id);
      return json({ok:true,invention,xp,user:publicUser(updated,await creationAllowance(env.DB,updated))});
    }

"""
              if marker not in s: raise SystemExit('worker marker missing')
              s=s.replace(marker,endpoint+marker,1)
          w.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check backend/worker.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html frontend/auth-gate.js backend/worker.js
          git diff --cached --quiet || git commit -m 'Persist local creations in user profile'
          git push
