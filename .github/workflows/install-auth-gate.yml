name: Install FUTUROLOGIO account gate

on:
  push:
    paths:
      - 'frontend/auth-gate.js'
      - '.github/workflows/install-auth-gate.yml'
      - 'backend/worker.js'
      - 'backend/schema.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend and backend
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="frontend/auth-gate.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          w=Path('backend/worker.js')
          s=w.read_text(encoding='utf-8').replace('INSERT INTO SHARES(user_id,inventionId,platform)','INSERT INTO SHARES(user_id,invention_id,platform)')
          marker="      if(path==='/api/create' && request.method==='POST'){"
          endpoint="""      if(path==='/api/consume-creation' && request.method==='POST'){
        if(!session)return json({ok:false,error:'Não autenticado'},401); const u=await refreshUser(env.DB,session.sub); if(!u)return json({ok:false,error:'Usuário não encontrado'},404);
        const a=await creationAllowance(env.DB,u); if(a.remaining<=0)return json({ok:false,error:'Limite diário atingido',allowance:a},429);
        if(a.used<a.base){await env.DB.prepare('UPDATE USERS SET daily_creations=daily_creations+1,daily_creation_date=?,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(today(),u.id).run();}else{await env.DB.prepare('UPDATE USERS SET extra_credits=extra_credits-1,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(u.id).run();}
        const updated=await refreshUser(env.DB,u.id); const xp=await grantXp(env.DB,updated,'creation','creation',Date.now()); return json({ok:true,xp,allowance:await creationAllowance(env.DB,updated)});
      }

"""
          if "'/api/consume-creation'" not in s:
              s=s.replace(marker,endpoint+marker,1)
          w.write_text(s,encoding='utf-8')
          sc=Path('backend/schema.sql')
          s=sc.read_text(encoding='utf-8').replace('google_id TEXT UNIQUE,','google_id TEXT UNIQUE,\n  password_hash TEXT,')
          sc.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backend/worker.js backend/schema.sql
          git diff --cached --quiet || git commit -m 'Enforce authenticated creation limits'
          git push
