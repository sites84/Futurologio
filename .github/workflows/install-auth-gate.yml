name: Install FUTUROLOGIO account gate

on:
  push:
    paths:
      - 'frontend/auth-gate.js'
      - '.github/workflows/install-auth-gate.yml'
      - 'backend/worker.js'
      - 'backend/schema.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend and backend typo
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="frontend/auth-gate.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          w=Path('backend/worker.js')
          s=w.read_text(encoding='utf-8').replace('INSERT INTO SHARES(user_id,inventionId,platform)','INSERT INTO SHARES(user_id,invention_id,platform)')
          w.write_text(s,encoding='utf-8')
          sc=Path('backend/schema.sql')
          s=sc.read_text(encoding='utf-8').replace('google_id TEXT UNIQUE,','google_id TEXT UNIQUE,\n  password_hash TEXT,')
          sc.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backend/worker.js backend/schema.sql
          git diff --cached --quiet || git commit -m 'Require account before creating inventions'
          git push
